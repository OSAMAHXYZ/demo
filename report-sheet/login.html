<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · ALJ Report Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <script src="auth.js?v=20261030auth3"></script>
  <style>
    :root {
      --bg: #070b14;
      --panel: #101a2b;
      --line: rgba(148, 163, 184, 0.22);
      --ink: #e8eef7;
      --muted: #8d9bb0;
      --toyota: #eb0a1e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Manrope, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 8% -10%, rgba(235, 10, 30, 0.18), transparent 55%),
        radial-gradient(800px 480px at 100% 0%, rgba(59, 130, 246, 0.14), transparent 50%),
        linear-gradient(180deg, #070b14, #05080f);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: linear-gradient(180deg, rgba(18, 28, 46, 0.98), rgba(12, 20, 34, 0.98));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 26px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .brand img { width: 40px; height: 40px; object-fit: contain; }
    .brand strong {
      display: block;
      font-family: "Space Grotesk", Manrope, sans-serif;
      letter-spacing: 0.08em;
      font-size: 13px;
    }
    .brand span { color: var(--muted); font-size: 12px; }
    h1 {
      margin: 0 0 6px;
      font-family: "Space Grotesk", Manrope, sans-serif;
      font-size: 1.55rem;
      letter-spacing: -0.03em;
    }
    .sub { margin: 0 0 20px; color: var(--muted); font-size: 0.92rem; line-height: 1.45; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    label { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    input, select {
      height: 42px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: #0b1220;
      color: var(--ink);
      padding: 0 12px;
      font: inherit;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .remember input { width: auto; height: auto; }
    .error { min-height: 18px; color: #fb7185; font-size: 0.88rem; margin: 0 0 10px; }
    button {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 11px;
      background: var(--toyota);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .hint {
      margin: 16px 0 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .hint b { color: #fecaca; }
  </style>
</head>
<body>
  <form class="card" id="login-form" autocomplete="on">
    <div class="brand">
      <img src="../images/logo/toyota.png" alt="" width="40" height="40" onerror="this.style.display='none'" />
      <div>
        <strong>TOYOTA</strong>
        <span>ALJ · Report Sheet</span>
      </div>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Sign in with your own account. Access is set by Khayri.</p>
    <div class="field">
      <label for="user">Username</label>
      <input id="user" name="username" type="text" autocomplete="username" required placeholder="Your username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </div>
    <label class="remember"><input id="remember" type="checkbox" /> Remember me on this browser</label>
    <p class="error" id="error"></p>
    <button type="submit">Sign in</button>
  </form>
  <script>
    (function () {
      const Auth = window.ReportSheetAuth;
      const existing = Auth.current();
      if (existing) {
        location.replace(Auth.homeFor(existing));
        return;
      }
      document.getElementById("login-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const error = document.getElementById("error");
        error.textContent = "";
        try {
          const user = Auth.login(
            document.getElementById("user").value,
            document.getElementById("password").value,
            document.getElementById("remember").checked
          );
          location.replace(Auth.homeFor(user));
        } catch (err) {
          error.textContent = err.message || "Sign in failed.";
        }
      });
    })();
  </script>
</body>
</html>
