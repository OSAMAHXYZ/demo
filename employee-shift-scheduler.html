<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workforce Control Center</title>
<style>
  :root {
    --bg: #f3f5f7;
    --card: #ffffff;
    --ink: #14181f;
    --muted: #667085;
    --line: #e6ebf1;
    --green: #0f6e56;
    --green-soft: #e8f6f1;
    --off: #667085;
    --off-soft: #f2f4f7;
    --vac: #3d4c9e;
    --vac-soft: #eef0fa;
    --warn: #b54708;
    --warn-soft: #fff6ed;
    --shadow: 0 10px 30px rgba(16, 24, 40, .06);
    --radius: 16px;
    --nav: 68px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 400px at 10% -10%, rgba(15, 110, 86, .08), transparent 50%),
      radial-gradient(900px 360px at 100% 0%, rgba(61, 76, 158, .06), transparent 46%),
      var(--bg);
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .topnav {
    position: sticky; top: 0; z-index: 30;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "brand links tools";
    align-items: center; gap: 14px;
    min-height: var(--nav); padding: 10px 22px;
    background: rgba(255, 255, 255, .92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
  }
  .brand { grid-area: brand; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }
  .mark {
    width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center;
    background: linear-gradient(160deg, #1a4f45, #102820);
    color: white; flex: 0 0 auto;
  }
  .brand strong { display: block; font-size: 13px; letter-spacing: .14em; }
  .brand em { display: block; font-style: normal; font-size: 11px; letter-spacing: .16em; color: var(--muted); }
  .nav-links { grid-area: links; display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links button {
    border: 0; background: transparent; color: #3f4854;
    padding: 8px 12px; border-radius: 999px; white-space: nowrap;
    transition: background .18s, color .18s;
  }
  .nav-links button:hover { background: #f2f4f7; }
  .nav-links button.on { background: #14181f; color: white; }
  .nav-right { grid-area: tools; display: flex; align-items: center; gap: 8px; }
  .today-chip { color: var(--muted); font-size: 13px; padding-right: 6px; white-space: nowrap; }
  .icon-btn, .btn, .btn-primary, .btn-ghost {
    border-radius: 999px; border: 1px solid var(--line); background: white;
    padding: 8px 14px; transition: transform .18s, box-shadow .18s, background .18s;
  }
  .icon-btn { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; position: relative; }
  .icon-btn:hover, .btn:hover, .btn-ghost:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .btn-primary {
    border: 0; color: white; padding: 10px 16px;
    background: linear-gradient(180deg, #1c564b, #123f37);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(18, 63, 55, .25); }
  .btn-primary.small { padding: 6px 10px; font-size: 13px; }
  .btn-ghost { background: transparent; }
  .btn.small, .btn-ghost.small { padding: 6px 10px; font-size: 13px; }
  .badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px;
    background: #b54708; color: white; font-size: 11px; display: grid; place-items: center;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 72px; }
  .wrap.wide { max-width: none; }
  .month-sheet { overflow-x: auto; background: white; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .month-sheet table { border-collapse: collapse; width: 100%; font-size: 11px; }
  .month-sheet th, .month-sheet td { border: 1px solid var(--line); padding: 5px 3px; text-align: center; min-width: 52px; vertical-align: middle; line-height: 1.25; }
  .month-sheet td { white-space: normal; }
  .month-sheet .st-leave { background: #fff6ed; color: #9a5410; font-weight: 650; }
  .sched-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin: 4px 0 8px; }
  .sched-controls label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  .sched-controls select, .sched-controls input { border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; background: white; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .month-sheet thead th { background: #f8fafb; font-size: 11px; }
  .month-sheet th span { display: block; font-weight: 500; color: var(--muted); font-size: 10px; }
  .month-sheet .who { text-align: left; min-width: 148px; position: sticky; left: 0; background: white; z-index: 1; padding: 6px 8px; }
  .month-sheet thead .who { background: #f8fafb; z-index: 2; }
  .month-sheet .who b, .month-sheet .who small { display: block; }
  .month-sheet .who small { color: var(--muted); font-size: 10px; }
  .month-sheet .st-work { background: var(--green-soft); color: var(--green); font-weight: 650; }
  .month-sheet .st-off { background: var(--off-soft); color: var(--off); }
  .month-sheet .st-vac { background: var(--vac-soft); color: var(--vac); font-weight: 650; }
  .month-sheet .st-empty { color: var(--muted); }
  .month-sheet .fri { box-shadow: inset 0 -2px 0 #d0d5dd; }
  .page-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; }
  .kicker { margin: 0 0 6px; color: var(--muted); letter-spacing: .12em; font-size: 12px; text-transform: uppercase; }
  h1 { margin: 0; font-size: 32px; letter-spacing: -.03em; font-weight: 650; }
  .sub { margin: 6px 0 0; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid-5, .grid-4, .grid-2 { display: grid; gap: 14px; }
  .grid-5 { grid-template-columns: repeat(5, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-2 { grid-template-columns: 1.4fr .8fr; }
  .card {
    background: var(--card); border: 1px solid rgba(255,255,255,.8);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px;
  }
  .kpi .lbl, .stat .lbl { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
  .kpi .val, .stat .val { font-size: 34px; letter-spacing: -.04em; margin-top: 8px; font-weight: 650; }
  .kpi .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .section-title { margin: 26px 0 12px; font-size: 13px; letter-spacing: .12em; color: #3f4854; }
  .stat { min-height: 118px; }
  .band { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .chart-card { margin-top: 14px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; }
  .seg button { border: 1px solid var(--line); background: #f8fafb; border-radius: 999px; padding: 7px 12px; }
  .seg button.on { background: #14181f; color: white; border-color: #14181f; }
  .legend { display: flex; gap: 14px; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 6px; }
  canvas#man-chart { width: 100%; height: 280px; display: block; }
  .tip {
    position: absolute; pointer-events: none; background: #14181f; color: white;
    padding: 8px 10px; border-radius: 10px; font-size: 12px; opacity: 0; transition: opacity .15s;
  }
  .chart-wrap { position: relative; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters input, .filters select, .field input, .field select, .field textarea {
    border: 1px solid var(--line); background: white; border-radius: 12px; padding: 10px 12px; outline: none;
  }
  .filters input { min-width: 220px; flex: 1; }
  .filters input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: #9aa8b8; box-shadow: 0 0 0 4px rgba(20, 24, 31, .05); }
  .emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .emp-card { padding: 18px; display: flex; flex-direction: column; gap: 8px; transition: transform .18s, box-shadow .18s; }
  .emp-card:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(16, 24, 40, .08); }
  .emp-top { display: flex; gap: 12px; align-items: center; }
  .avatar {
    width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
    font-weight: 650; color: #143d36; background: #e7f3ef; flex: 0 0 auto;
  }
  .avatar.sm { width: 36px; height: 36px; border-radius: 12px; font-size: 12px; }
  .emp-top b { display: block; }
  .muted, .emp-top small, .who small { color: var(--muted); }
  .meta { font-size: 13px; color: #3f4854; line-height: 1.45; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border-radius: 999px; padding: 4px 8px; background: var(--green-soft); color: var(--green); }
  .pill.off { background: var(--off-soft); color: var(--off); }
  .pill.vac { background: var(--vac-soft); color: var(--vac); }
  .emp-card .actions { margin-top: auto; padding-top: 8px; }
  .board-scroll { overflow: auto; max-height: calc(100vh - 230px); border-radius: 18px; border: 1px solid var(--line); background: white; box-shadow: var(--shadow); }
  table.sheet { border-collapse: separate; border-spacing: 0; min-width: 980px; width: 100%; }
  .sheet th, .sheet td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; background: white; }
  .sheet thead th { position: sticky; top: 0; z-index: 2; font-size: 12px; letter-spacing: .06em; color: var(--muted); text-align: left; background: #fbfcfd; }
  .sheet .who { position: sticky; left: 0; z-index: 1; min-width: 240px; max-width: 280px; }
  .sheet thead .who { z-index: 3; }
  .who-box { display: flex; gap: 10px; align-items: center; }
  .who-box > span { min-width: 0; }
  .who-box b, .who small { display: block; line-height: 1.3; }
  .cell-card { border-radius: 12px; padding: 10px 8px; min-height: 78px; text-align: center; }
  .cell-card b { display: block; font-size: 11px; letter-spacing: .08em; margin-bottom: 4px; }
  .cell-card span { display: block; font-size: 12px; }
  .cell-card.work { background: var(--green-soft); color: #0b5c48; }
  .cell-card.off { background: var(--off-soft); color: #526071; }
  .cell-card.vacation { background: var(--vac-soft); color: var(--vac); }
  .health { display: flex; gap: 16px; align-items: center; }
  .ring { width: 92px; height: 92px; }
  .ring-bg { fill: none; stroke: #e7ebf0; stroke-width: 8; }
  .ring-fg { fill: none; stroke: var(--green); stroke-width: 8; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 44px 44px; }
  .ring text { font-size: 16px; font-weight: 650; fill: var(--ink); transform: none; }
  .warn {
    background: var(--warn-soft); border: 1px solid #f5d7bd; color: #8a3b0c;
    border-radius: 14px; padding: 14px 16px; margin: 12px 0;
  }
  .warn b { letter-spacing: .06em; }
  .heat { width: 100%; border-collapse: separate; border-spacing: 8px; }
  .heat th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .heat-cell, .heat-closed {
    width: 100%; min-height: 74px; border-radius: 14px; border: 0;
    font-size: 22px; font-weight: 650; transition: transform .18s;
  }
  .heat-cell:hover { transform: translateY(-2px); }
  .heat-closed { background: #eef1f4; color: #98a2b3; font-size: 16px; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-dow { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: .06em; }
  .cal-day { min-height: 108px; border-radius: 14px; background: white; border: 1px solid var(--line); padding: 8px; text-align: left; cursor: pointer; font: inherit; }
  .cal-day.out { opacity: .45; }
  .cal-day.today { outline: 2px solid #143d36; }
  .cal-day .n { font-size: 12px; color: var(--muted); }
  .chip {
    display: block; width: 100%; text-align: left; margin-top: 4px; border: 0; border-radius: 8px;
    padding: 4px 6px; font-size: 11px; background: var(--vac-soft); color: var(--vac);
  }
  .chip.t-annual { background: #eef0fa; color: #3d4c9e; }
  .chip.t-emergency { background: #fff4e8; color: #9a5410; }
  .chip.t-sick { background: #fdecec; color: #8d3a3a; }
  .chip.t-personal { background: #e8f6f1; color: #0f6e56; }
  .chip.t-training { background: #eef3f8; color: #3d5270; }
  .chip.t-other { background: #f2f4f7; color: #526071; }
  table.list { width: 100%; border-collapse: collapse; }
  table.list th, table.list td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
  table.list th { color: var(--muted); font-size: 12px; letter-spacing: .06em; }
  .empty {
    text-align: center; padding: 48px 16px; color: var(--muted);
  }
  .empty svg { margin-bottom: 8px; }
  .empty h3 { margin: 8px 0; color: var(--ink); letter-spacing: .08em; }
  .rule { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .rule + .rule { margin-top: 12px; }
  .scrim {
    position: fixed; inset: 0; z-index: 40; background: rgba(16, 20, 24, .35);
    display: grid; place-items: center; padding: 22px;
    animation: fade .18s ease;
  }
  .dialog, .drawer {
    background: white; border-radius: 20px; box-shadow: 0 24px 60px rgba(16, 24, 40, .18);
    width: min(560px, 100%); max-height: min(86vh, 820px); overflow: auto; padding: 22px;
    animation: rise .22s ease;
  }
  .drawer { width: min(420px, 100%); margin-left: auto; height: 100%; max-height: none; border-radius: 20px 0 0 20px; }
  .scrim.drawer-scrim { place-items: stretch end; padding: 0; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field.row { flex-direction: row; gap: 10px; }
  .field.row > div { flex: 1; }
  .vac-range {
    display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px 10px; align-items: end;
    padding: 10px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 14px; background: #f8fafb;
  }
  .vac-range .field { margin: 0; }
  .vac-range .vac-type { grid-column: 1 / 3; }
  .days { display: flex; flex-wrap: wrap; gap: 8px; }
  .days label { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 13px; }
  .step { padding: 8px 0; color: var(--muted); }
  .step.on { color: var(--ink); font-weight: 650; }
  .step.done { color: var(--green); }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #14181f; color: white; padding: 10px 14px; border-radius: 999px;
    z-index: 50; font-size: 13px;
  }
  .menu { position: relative; }
  .menu summary { list-style: none; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu-pop {
    position: absolute; right: 0; top: calc(100% + 6px); background: white;
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    min-width: 180px; padding: 6px; z-index: 5;
  }
  .menu-pop button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 8px 10px; }
  .menu-pop button:hover { background: #f4f6f8; }
  .check { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (max-width: 1100px) {
    .topnav {
      grid-template-columns: 1fr auto;
      grid-template-areas: "brand tools" "links links";
      row-gap: 6px;
    }
  }
  @media (max-width: 980px) {
    .grid-5, .grid-4, .band, .grid-2 { grid-template-columns: 1fr 1fr; }
    h1 { font-size: 26px; }
  }
  @media (max-width: 720px) {
    .topnav { padding: 10px; }
    .grid-5, .grid-4, .band, .grid-2 { grid-template-columns: 1fr; }
    .brand { min-width: 0; }
    .today-chip { display: none; }
    .cal-day { min-height: 78px; }
    .wrap { padding: 18px 12px 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media print {
    .topnav, .actions, .filters, .scrim, .toast, .legend, .card, .warn, .screen-only, .menu { display: none !important; }
    body { background: white; }
    .wrap { max-width: none; padding: 0; }
    .page-head { margin-bottom: 8px; }
    h1 { font-size: 18px; }
    .month-sheet { overflow: visible; border: 0; border-radius: 0; box-shadow: none; }
    .month-sheet table { width: 100%; table-layout: fixed; font-size: 6px; }
    .month-sheet th, .month-sheet td { min-width: 0; padding: 1px; white-space: normal; overflow: hidden; }
    .month-sheet thead .who, .month-sheet td.who { width: 8%; }
    .month-sheet .who { min-width: 0; position: static; font-size: 7px; }
    .month-sheet th span, .month-sheet .who small { font-size: 6px; }
  }
  @page { size: A4 landscape; margin: 8mm; }
</style>
</head>
<body>
<header class="topnav">
  <button class="brand" type="button" data-go="dashboard">
    <span class="mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="5" width="18" height="16" rx="2"></rect>
        <path d="M3 10h18M8 3v4M16 3v4"></path>
      </svg>
    </span>
    <span><strong>WORKFORCE</strong><em>CONTROL CENTER</em></span>
  </button>
  <nav class="nav-links" aria-label="Primary">
    <button type="button" data-go="dashboard">Dashboard</button>
    <button type="button" data-go="employees">Employees</button>
    <button type="button" data-go="schedule">Schedule</button>
    <button type="button" data-go="manpower">Manpower</button>
    <button type="button" data-go="vacations">Vacations</button>
    <button type="button" data-go="rules">Rotation</button>
  </nav>
  <div class="nav-right">
    <span class="today-chip" id="today-label"></span>
    <button class="icon-btn" type="button" data-act="notes" aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
      <span class="badge" id="note-badge" hidden>0</span>
    </button>
    <button class="icon-btn" type="button" data-act="settings" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"></path></svg>
    </button>
  </div>
</header>
<main id="main"></main>
<div id="overlay"></div>
<div id="toast" hidden></div>
<input id="import-file" type="file" accept="application/json,.json" hidden />

<script>
(() => {
  const DAYS = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  const WEEKDAYS = DAYS.slice(0, 6);
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const BLOCKS = [
    { id: 'am', label: '9 AM – 12 PM', short: '9–12', start: 9 * 60, end: 12 * 60 },
    { id: 'mid', label: '12 PM – 5 PM', short: '12–5', start: 12 * 60, end: 17 * 60 },
    { id: 'pm', label: '5 PM – 9 PM', short: '5–9', start: 17 * 60, end: 21 * 60 },
  ];
  const ROLES = [
    ['advisor', 'Sales Advisors'],
    ['promoter', 'Promoters'],
    ['testdrive', 'Test Drive'],
    ['coordinator', 'Coordinator'],
  ];
  const VACATION_TYPES = ['Annual Vacation', 'Emergency Vacation', 'Sick Leave', 'Personal Leave', 'Training', 'Other'];
  const VIEWS = ['dashboard', 'employees', 'schedule', 'manpower', 'vacations', 'rules'];
  const KEY = 'wcc-store-v1';
  const LEGACY_KEY = 'employee-shift-scheduler-v1';
  const THU_A = ['48476', '49973', '50338', '47674'];
  const SAT_A = ['50345', '50093', '50822'];
  const ADVISORS = [
    { id: '48476', ar: 'علي الحربي', short: 'Ali' },
    { id: '50345', ar: 'متعب الشهري', short: 'Muteb' },
    { id: '49973', ar: 'غدير الطياري', short: 'Ghadeer' },
    { id: '50093', ar: 'لجين بازهير', short: 'Lujen' },

          if (row.status === 'work' && hits) {
            counts[key] += 1;
            working.push({ id: emp.id, name: emp.name, position: emp.position, role: key });
          }
          if (row.status === 'vacation' && !row.offReason && hits) {
            vacationImpact.push({ id: emp.id, name: emp.name, type: row.vacation ? row.vacation.type : 'Vacation' });
          }
        });
        const total = Object.values(counts).reduce((sum, n) => sum + n, 0);
        return { ...block, counts, total, working, vacationImpact };
      });
      return { ...col, day: col.name, closed: false, blocks };
    });
  }
  function buildWarnings() {
    const min = Number(state.settings.minManpower) || 0;
    const warnings = [];
    buildCoverage().forEach((day) => {
      if (day.closed) return;
      day.blocks.forEach((block) => {
        const before = block.total + block.vacationImpact.length;
        if (block.vacationImpact.length && block.total < min && before >= min) {
          warnings.push({
            day: day.day,
            date: day.key,
            label: block.label,
            short: block.short,
            blockId: block.id,
            required: min,
            available: block.total,
            shortage: min - block.total,
            people: block.vacationImpact,
          });
        }
      });
    });
    return warnings;
  }
  function displayedCount(block, role) {
    if (role === 'total') return block.total;
    return block.counts[role] || 0;
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify({
      employees: state.employees,
      vacations: state.vacations,
      settings: state.settings,
      schedule: state.schedule,
      generation: state.generation,
      lastSig: state.lastSig,
    }));

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.employees) && data.employees.length) {
          state.employees = data.employees.map((e) => ({ notes: '', ...e }));
          state.vacations = Array.isArray(data.vacations) ? data.vacations : [];
          state.settings = { minManpower: 8, strategy: 'balanced', ...(data.settings || {}) };
          state.schedule = data.schedule || null;
          state.generation = data.generation || 0;
          state.lastSig = data.lastSig || '';
          return;
        }
      }
    } catch (err) { /* keep defaults */ }
    try {
      const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
      if (Array.isArray(legacy) && legacy.length && legacy.every((e) => e && e.id && e.name)) {
        state.employees = legacy.map((e) => ({ notes: '', ...e }));
        return;
      }

    state.employees = defaultEmployees();

  function clearSchedule() {

  function upcomingList() {
    const today = iso(new Date());
    return state.vacations
      .filter((v) => v.endDate >= today)
      .sort((a, b) => a.startDate.localeCompare(b.startDate));
  }
  function monthVacationDays(year, month) {
    const start = iso(new Date(year, month, 1));
    const end = iso(new Date(year, month + 1, 0));
    let count = 0;
    state.vacations.forEach((v) => {
      const from = v.startDate > start ? v.startDate : start;
      const to = v.endDate < end ? v.endDate : end;
      if (from <= to) count += inclusiveDays(from, to);
    });
    return count;
  }
  function onVacationToday() {
    const today = iso(new Date());
    return state.employees.filter((e) => vacationOn(e.id, today)).length;
  }
  function notifications() {
    const items = [];
    state.warnings.forEach((w) => items.push({ kind: 'warn', text: `${w.day} ${w.label}: short ${w.shortage}` }));
    upcomingList().slice(0, 6).forEach((v) => {
      const emp = empById(v.employeeId);
      items.push({ kind: 'vac', text: `${emp ? emp.name : v.employeeId} · ${v.type} · ${fmtShort(v.startDate)}` });
    });
    return items;
  }
  function todayStats() {
    const today = iso(new Date());
    const vac = onVacationToday();
    if (!allRows().some((r) => r.date === today)) {
      return { work: null, off: null, vac, total: null, outside: !!state.schedule };
    }
    let work = 0;
    let off = 0;
    state.employees.forEach((emp) => {
      const row = rowOnDate(emp.id, today);
      if (!row) return;
      if (row.status === 'work') work += 1;
      else if (row.status === 'off') off += 1;
    });
    return { work, off, vac, total: work, outside: false };
  }
  function chartSeries() {
    const coverage = buildCoverage();
    const role = state.chartRole;
    const series = [
      { name: 'Morning', color: '#0f6e56', values: [] },
      { name: 'Afternoon', color: '#3d4f7c', values: [] },
      { name: 'Evening', color: '#8aa0b8', values: [] },
    ];
    DAYS.forEach((day) => {
      const col = coverage.find((d) => d.day === day);
      if (!col || col.closed) {
        series.forEach((s) => s.values.push(0));
        return;
      }
      series[0].values.push(displayedCount(col.blocks[0], role));
      series[1].values.push(displayedCount(col.blocks[1], role));
      series[2].values.push(displayedCount(col.blocks[2], role));
    });
    return series;
  }
  function heatColor(value, max) {
    if (!value) return '#eef2f4';
    const t = Math.max(0, Math.min(1, value / (max || 1)));
    const r = Math.round(232 - t * 214);
    const g = Math.round(242 - t * 132);
    const b = Math.round(236 - t * 150);
    return `rgb(${r}, ${g}, ${b})`;
  }
  function offLabel(row) {
    if (row.offReason === 'friday') return 'Friday Off';
    if (row.offReason === 'fixed') return 'Fixed Off';
    return 'Weekly Off';
  }
  function ruleSummary(emp) {
    const hours = normalizeShifts(emp).map((s) => s.label).join(' / ') || 'No shift';
    let offs = 'Friday OFF';
    let mode = 'Friday only';
    if (emp.offMode === 'fixed') {
      offs = DAYS.filter((d) => (emp.fixedOffDays || []).includes(d) || d === 'Friday').join(' + ') + ' OFF';
      mode = 'Fixed off days';
    } else if (emp.offMode === 'advisor-pool') {
      offs = 'Friday OFF · Thursday or Saturday OFF';
      mode = 'Advisor pool';
    } else if (emp.offMode === 'rotation') {
      offs = 'Friday OFF · Week A / Week B Thursday or Saturday';
      mode = 'Sales advisor rotation';
    } else if (emp.offMode === 'flexible') {
      offs = 'Friday OFF · one extra weekday OFF';
      mode = 'Flexible';
    }
    return { hours, offs, mode };
  }
  function statusOf(emp) {
    const today = iso(new Date());
    const leave = vacationOn(emp.id, today);
    if (leave && absenceOf(leave) === 'timeoff') return { cls: 'off', text: 'Time off' };
    if (leave) return { cls: 'vac', text: 'On vacation' };
    const row = rowOnDate(emp.id, today);
    if (row && row.status === 'off') return { cls: 'off', text: 'Off today' };
    return { cls: '', text: 'Active' };
  }
  function matchesFilters(emp) {
    const f = state.filters;
    const q = f.q.trim().toLowerCase();
    if (q && !`${emp.name} ${emp.id} ${emp.position} ${emp.department}`.toLowerCase().includes(q)) return false;
    if (f.dept && emp.department !== f.dept) return false;
    if (f.pos && emp.position !== f.pos) return false;
    const status = statusOf(emp).text;
    if (f.status === 'active' && status !== 'Active') return false;
    if (f.status === 'off' && status !== 'Off today') return false;
    if (f.status === 'vacation' && status !== 'On vacation') return false;
    const mine = vacationsFor(emp.id);
    const today = iso(new Date());
    const hasUpcoming = mine.some((v) => v.startDate > today);
    const onVac = mine.some((v) => v.startDate <= today && v.endDate >= today);
    if (f.vacation === 'none' && mine.length) return false;
    if (f.vacation === 'upcoming' && !hasUpcoming) return false;
    if (f.vacation === 'active' && !onVac) return false;
    if (f.offday === 'friday' && emp.offMode !== 'friday-only') return false;
    if (f.offday === 'flexible' && emp.offMode !== 'flexible') return false;
    if (f.offday === 'thursday' || f.offday === 'saturday') {
      const day = f.offday === 'thursday' ? 'Thursday' : 'Saturday';
      const fixed = emp.offMode === 'fixed' && (emp.fixedOffDays || []).includes(day);
      const row = rowFor(emp.id, day);
      if (!fixed && !(row && row.offReason === 'generated')) return false;
    }
    return true;
  }
  function vacationLine(emp) {
    const mine = vacationsFor(emp.id);
    if (!mine.length) return 'None';
    const today = iso(new Date());
    const count = mine.length > 1 ? ` · ${mine.length} periods` : '';
    const active = mine.find((v) => v.startDate <= today && v.endDate >= today);
    if (active) return `${active.type}${count}`;
    const next = mine.find((v) => v.startDate > today);
    if (next) return `Upcoming ${fmtShort(next.startDate)}${count}`;
    return `${mine.length} period${mine.length === 1 ? '' : 's'}`;
  }

  function ring(pct) {

  }

  function advisorManpower() {
    const when = scheduleMonth();

    return monthDates(when.year, when.month).map((date) => {
      const names = BLOCKS.map(() => []);

        ADVISORS.forEach((advisor) => {
          const row = rowOnDate(advisor.id, date.key);
          if (!row || row.status !== 'work') return;
          BLOCKS.forEach((block, index) => {
            const minutes = (row.shifts || []).reduce((sum, shift) => {
              const start = Math.max(shift.start, block.start);
              const end = Math.min(shift.end, block.end);
              return sum + Math.max(0, end - start);
            }, 0);
            if (minutes >= 60) names[index].push(advisor.short);
          });
        });
      }
      const unique = new Set(names.flat());
      return { ...date, names, counts: names.map((list) => list.length), total: date.name === 'Friday' ? 0 : unique.size };
    });

  function drawChart() {
    const canvas = $('#man-chart');
    if (!canvas || !state.schedule) return;
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 640;
    const h = canvas.clientHeight || 280;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const series = chartSeries();
    const max = Math.max(1, ...series.flatMap((s) => s.values));
    const pad = { l: 32, r: 8, t: 12, b: 28 };
    ctx.clearRect(0, 0, w, h);
    ctx.font = '12px Segoe UI, sans-serif';
    ctx.textAlign = 'left';
    ctx.strokeStyle = '#e7ebf0';
    ctx.fillStyle = '#98a2b3';
    for (let i = 0; i <= 4; i += 1) {
      const y = pad.t + (h - pad.t - pad.b) * (1 - i / 4);
      ctx.beginPath();
      ctx.moveTo(pad.l, y);
      ctx.lineTo(w - pad.r, y);
      ctx.stroke();
      ctx.fillText(String(Math.round(max * i / 4)), 0, y + 4);
    }
    const group = (w - pad.l - pad.r) / 7;
    const barW = Math.min(16, (group - 20) / 3);
      DAYS.forEach((label, i) => {
      series.forEach((item, s) => {
        const bh = Math.max(0, (item.values[i] / max) * (h - pad.t - pad.b));
        const x = pad.l + i * group + (group - (barW * 3 + 8)) / 2 + s * (barW + 4);
        const y = pad.t + (h - pad.t - pad.b) - bh;
        ctx.fillStyle = item.color;
        ctx.beginPath();
        const radius = Math.min(4, bh / 2, barW / 2);
        if (bh > 0 && ctx.roundRect) ctx.roundRect(x, y, barW, bh, radius);
        else ctx.rect(x, y, barW, bh);
        ctx.fill();
      });
      ctx.fillStyle = '#667085';
      ctx.textAlign = 'center';
      ctx.fillText(label.slice(0, 3), pad.l + i * group + group / 2, h - 8);
    });
    canvas._layout = { pad, group, series, w, h };
  }

  function playGenerate(year, month) {
    if (state.busy) return;
    state.busy = true;
    const steps = ['READING THE ROTATION...', 'CHECKING VACATIONS...', 'APPLYING WEEK A AND WEEK B...', 'COUNTING MANPOWER...', 'VALIDATING SCHEDULE...'];
    let index = 0;
    const paint = (done) => {
      openOverlay(`<h2 style="margin-top:0">${done ? 'SCHEDULE GENERATED' : 'Generating'}</h2>${steps.map((text, i) => `<div class="step ${done || i < index ? 'done' : ''} ${!done && i === index ? 'on' : ''}">${done || i < index ? '✓' : '○'} ${text}</div>`).join('')}${done ? '<p>✓ The month is ready.</p>' : ''}`);
    };
    const finish = (ok) => {
      state.busy = false;
      if (!ok) {
        closeOverlay();
        toast('The schedule could not be generated.');
        return;
      }
      paint(true);
      setTimeout(() => { closeOverlay(); state.view = 'schedule'; render(); toast('Schedule generated'); }, 700);
    };
    paint(false);
    const tick = () => {
      index += 1;
      if (index < steps.length) {
        paint(false);
        setTimeout(tick, 420);
        return;
      }
      try {
        runGenerate(year, month);
        finish(true);
      } catch (err) {
        finish(false);
      }
    };
    setTimeout(tick, 420);
  }
  function runGenerate(year, month) {

      const result = generateSchedule(state.employees, 1, week, state.vacations);
      result.sig = signature(result.rows);
      return result;
    });
    state.sameArrangement = false;
    state.lastSig = built.map((w) => w.sig).join('||');

      month,
      strategy: 'rotation',
      rotationStart: state.settings.rotationStart,
      start: iso(new Date(year, month, 1)),
      end: iso(new Date(year, month + 1, 0)),
      weeks: built,
    };
    state.generation += 1;
    state.stale = false;
    applyVacations();
    save();
  }

      <p style="margin-top:12px">Total: <b id="v-days">No dates yet</b></p>
      <p class="muted" id="v-msg"></p>
      <div class="actions"><button class="btn-ghost" type="button" data-act="close">Cancel</button><button class="btn-primary" type="button" data-act="save-vac">Submit dates</button></div>`);
    paintVacationRanges(emp ? emp.id : '');
  }
  function saveVacationFromForm() {
    const employeeId = $('#v-emp').value;
    const emp = empById(employeeId);
    if (!emp) { $('#v-msg').textContent = 'Choose an employee.'; return; }
    const records = [];
    const rows = [...document.querySelectorAll('.vac-range')];
    for (let i = 0; i < rows.length; i += 1) {
      const startDate = rows[i].querySelector('.v-from').value;
      const endDate = rows[i].querySelector('.v-until').value;
      if (!startDate && !endDate) continue;
      if (!startDate || !endDate) { $('#v-msg').textContent = `Period ${i + 1} needs both a from date and an until date.`; return; }
      if (endDate < startDate) { $('#v-msg').textContent = `Period ${i + 1}: until has to be on or after from.`; return; }
      records.push({
        id: rows[i].dataset.id || newVacId(),
        employeeId,
        type: rows[i].querySelector('.v-type').value,
        absence: rows[i].querySelector('.v-absence').value === 'timeoff' ? 'timeoff' : 'vacation',
        startDate,
        endDate,
        notes: rows[i].querySelector('.v-notes').value.trim(),
      });
    }
    records.sort((a, b) => a.startDate.localeCompare(b.startDate));
    for (let i = 1; i < records.length; i += 1) {
      if (records[i].startDate <= records[i - 1].endDate) {
        $('#v-msg').textContent = 'Two periods overlap. Adjust the dates so they do not cover the same days.';
        return;
      }
    }
    const previous = vacationsFor(employeeId);
    if (!records.length && previous.length && !confirm(`Remove every vacation period for ${emp.name}?`)) return;
    if (!records.length && !previous.length) { $('#v-msg').textContent = 'Add at least one from and until.'; return; }
    state.vacations = state.vacations.filter((v) => v.employeeId !== employeeId).concat(records);
    state.vacSeed = null;
    applyVacations();
    save();
    closeOverlay();
    render();
    const label = records.length === 1 ? '1 period' : `${records.length} periods`;
    toast(records.length
      ? (state.schedule ? `${label} saved. Those dates are now vacation on the schedule.` : `${label} saved. They apply when you generate.`)
      : 'Vacation dates cleared.');
  }

  function profileModal(id) {
    const emp = empById(id);
    if (!emp) return;
    const rule = ruleSummary(emp);
    const shifts = normalizeShifts(emp);
    const history = vacationsFor(id);
    const upcoming = history.filter((v) => v.endDate >= iso(new Date())).length;
    const week = DAYS.map((day) => {
      const row = rowFor(id, day);
      const label = !row ? '—' : row.status === 'work' ? 'WORK' : row.status === 'vacation' ? 'VACATION' : 'OFF';
      return `<div class="check"><span>${day}</span><b>${label}</b></div>`;
    }).join('');
    const past = history.map((v) => `<div class="check"><span>${esc(v.type)}<br><small class="muted">${fmtShort(v.startDate)} → ${fmtShort(v.endDate)}</small></span><span>${vacStatus(v)}</span></div>`).join('') || '<p class="muted">No vacation history.</p>';
    openOverlay(`<div class="emp-top"><span class="avatar">${esc(initials(emp.name))}</span><div><h2 style="margin:0">${esc(emp.name)}</h2><div class="muted">${esc(emp.id)} · ${esc(emp.position)}</div></div></div>
      <div class="check"><span>Department</span><b>${esc(emp.department)}</b></div>
      <div class="check"><span>Normal shift</span><b>${shifts.map((s) => esc(s.label)).join('<br>')}</b></div>
      <div class="check"><span>Weekly off</span><b>${esc(rule.offs)}</b></div>
      <div class="check"><span>Vacation</span><b>${upcoming} upcoming</b></div>
      <h3>This week</h3>${state.schedule ? week : '<p class="muted">Generate a schedule to see this week.</p>'}
      <h3 id="vac-history">Vacation history</h3>${past}
      <div class="actions"><button class="btn" type="button" data-act="edit" data-id="${esc(emp.id)}">Edit employee</button><button class="btn-primary" type="button" data-act="vac-add" data-id="${esc(emp.id)}">Vacation dates</button><button class="btn-ghost" type="button" data-act="scroll-history">View history</button></div>`);
  }
  function vacationDetail(id) {
    const vac = state.vacations.find((v) => v.id === id);
    if (!vac) return;
    const emp = empById(vac.employeeId);
    openOverlay(`<h2 style="margin-top:0">${esc(emp ? emp.name : vac.employeeId)}</h2>
      <div class="check"><span>Type</span><b>${esc(vac.type)}</b></div>
      <div class="check"><span>Start</span><b>${fmtLong(vac.startDate)}</b></div>
      <div class="check"><span>End</span><b>${fmtLong(vac.endDate)}</b></div>
      <div class="check"><span>Days</span><b>${inclusiveDays(vac.startDate, vac.endDate)}</b></div>
      <div class="check"><span>Status</span><b>${vacStatus(vac)}</b></div>
      <p>${esc(vac.notes || 'No notes.')}</p>
      <div class="actions"><button class="btn-ghost" type="button" data-act="close">Close</button><button class="btn" type="button" data-act="vac-edit" data-id="${esc(vac.id)}">Edit dates</button><button class="btn" type="button" data-act="vac-delete" data-id="${esc(vac.id)}">Delete</button></div>`);
  }
  function whoModal(day, blockId) {
    const coverage = buildCoverage();
    const col = coverage.find((d) => d.day === day);
    const block = col && col.blocks.find((b) => b.id === blockId);
    if (!col || !block) return;
    if (col.closed) {
      openOverlay(`<h2 style="margin-top:0">${esc(day)}</h2><p>Friday is closed. Manpower is 0.</p><button class="btn" type="button" data-act="close">Close</button>`);
      return;
    }
    const groups = ROLES.map(([key, label]) => {
      const names = block.working.filter((p) => p.role === key).map((p) => `<div>${esc(p.name)}</div>`).join('') || '<div class="muted">None</div>';
      return `<h3 style="margin-bottom:4px">${label}</h3>${names}`;
    }).join('');
    const others = block.working.filter((p) => p.role === 'other');
    openOverlay(`<h2 style="margin-top:0">${esc(day)}</h2><p class="muted">${esc(block.label)} · ${block.total} working</p>${groups}${others.length ? `<h3>Other</h3>${others.map((p) => `<div>${esc(p.name)}</div>`).join('')}` : ''}<div class="actions"><button class="btn" type="button" data-act="close">Close</button></div>`);
  }
  function affectedModal(day, blockId) {
    const warning = state.warnings.find((w) => w.day === day && w.blockId === blockId);
    if (!warning) return;
    openOverlay(`<h2 style="margin-top:0">Manpower warning</h2><p>${esc(warning.day)} · ${esc(warning.label)}</p><p>Required ${warning.required}<br>Available ${warning.available}<br>Shortage ${warning.shortage}</p><p>Reason: ${warning.people.length} employee${warning.people.length === 1 ? ' is' : 's are'} on vacation.</p>${warning.people.map((p) => `<div class="check"><span>${esc(p.name)}</span><b>${esc(p.type)}</b></div>`).join('')}<button class="btn" type="button" data-act="close">Close</button>`);
  }
  function issuesModal() {
    if (!state.validation) return;
    const passed = CHECKS.filter(([code]) => state.validation.checks[code]).map(([, label]) => `<div class="check"><span>✓ ${label}</span></div>`).join('');
    const failed = state.validation.issues.map((issue) => `<li>${esc(issue.message)}</li>`).join('');
    const title = state.validation.issues.length ? `${state.validation.issues.length} SCHEDULE ISSUES FOUND` : 'SCHEDULE VALID';
    openOverlay(`<h2 style="margin-top:0">${title}</h2>${failed ? `<ul>${failed}</ul>` : '<p>Friday, rotation, shifts, and leave all match.</p>'}<h3>Passed</h3>${passed}<button class="btn" type="button" data-act="close">Close</button>`);
  }

  function exportExcel() {
    const when = scheduleMonth();
    if (!when) { toast('Generate a schedule before exporting.'); return; }
    const dates = monthDates(when.year, when.month);
    const people = scheduleColumns();
    const head = ['Date', 'Day', 'Rotation', ...people.map((person) => person.sub ? `${person.title} (${person.sub})` : person.title)];
    const rows = dates.map((d) => [d.key, d.name, rotationName(rotationIndexFor(d.key)), ...people.map((person) => cellPlain(rowOnDate(person.id, d.key)))]);
    const man = [['Date', 'Day', '9-12', '12-5', '5-9', 'Total']];
    advisorManpower().forEach((row) => man.push([row.key, row.name, row.counts[0], row.counts[1], row.counts[2], row.total]));
    const table = (title, headers, body) => `<h2>${esc(title)}</h2><table><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>${table(`${MONTHS[when.month]} ${when.year} schedule`, head, rows)}${table('Manpower', man[0], man.slice(1))}</body></html>`;
    const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'workforce-schedule.xls';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
  function exportJson() {
    const blob = new Blob([JSON.stringify({
      employees: state.employees,
      vacations: state.vacations,
      settings: state.settings,
      schedule: state.schedule,
      generation: state.generation,
      lastSig: state.lastSig,
    }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'workforce-control-center.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }

  function onClick(event) {
    if (event.target.classList && event.target.classList.contains('scrim')) { closeOverlay(); return; }
    const btn = event.target.closest('[data-go], [data-act]');
    if (!btn) return;
    if (btn.dataset.go) { go(btn.dataset.go); return; }
    const act = btn.dataset.act;
    if (act === 'close') closeOverlay();
    if (act === 'open-generate') openGenerate();
    if (act === 'do-generate') {
      if (!state.employees.length) { toast('Add an employee first.'); return; }
      let year;
      let month;
      let start = '';
      if ($('#sched-month') && $('#sched-year')) {
        month = parseInt($('#sched-month').value, 10);
        year = parseInt($('#sched-year').value, 10);
        start = $('#sched-start') ? $('#sched-start').value : '';
      } else {
        const parts = String(($('#g-month') || {}).value || '').split('-');
        year = parseInt(parts[0], 10);
        month = parseInt(parts[1], 10) - 1;
        start = $('#g-start') ? $('#g-start').value : '';
      }
      if (!year || month < 0 || month > 11) { toast('Choose a month.'); return; }
      state.pickYear = year;
      state.pickMonth = month;
      state.settings.rotationStart = start || iso(new Date(year, month, 1));
      playGenerate(year, month);
    }
    if (act === 'regen') {
      if (!state.employees.length) return;
      const when = scheduleMonth() || { year: state.pickYear || new Date().getFullYear(), month: state.pickMonth != null ? state.pickMonth : new Date().getMonth() };
      if (!state.settings.rotationStart) state.settings.rotationStart = iso(new Date(when.year, when.month, 1));
      playGenerate(when.year, when.month);
    }
    if (act === 'validate') {
      if (!state.schedule) { toast('Generate a schedule first.'); return; }
      applyVacations();
      save();
      render();
      if (state.validation.issues.length) issuesModal();
      else toast('SCHEDULE VALID');
    }
    if (act === 'issues') issuesModal();
    if (act === 'chart') { state.chartRole = btn.dataset.role; render(); }
    if (act === 'heat') { state.heatRole = btn.dataset.role; render(); }
    if (act === 'profile') profileModal(btn.dataset.id);
    if (act === 'edit') employeeForm(empById(btn.dataset.id));
    if (act === 'add-employee') employeeForm(null);
    if (act === 'save-employee') {
      const emp = readEmployee();
      if (emp.error) { $('#e-msg').textContent = emp.error; return; }
      if (state.editingId) {
        const index = state.employees.findIndex((e) => e.id === state.editingId);
        if (state.editingId !== emp.id) state.vacations.forEach((v) => { if (v.employeeId === state.editingId) v.employeeId = emp.id; });
        if (index >= 0) state.employees[index] = emp;
      } else state.employees.push(emp);
      clearSchedule();
      save();
      closeOverlay();
      render();
      toast('Employee saved. Generate the schedule again.');
    }
    if (act === 'delete-employee') {
      const emp = empById(btn.dataset.id);
      if (!emp || !confirm(`Delete ${emp.name}?`)) return;
      state.employees = state.employees.filter((e) => e.id !== emp.id);
      state.vacations = state.vacations.filter((v) => v.employeeId !== emp.id);
      clearSchedule();
      save();
      closeOverlay();
      render();
    }
    if (act === 'vac-add') vacationForm(btn.dataset.id || '', null);
    if (act === 'vac-add-range') {
      const host = $('#vac-ranges');
      if (host) host.insertAdjacentHTML('beforeend', rangeMarkup({ id: '', type: VACATION_TYPES[0], startDate: '', endDate: '', notes: '' }));
    }
    if (act === 'vac-remove-range') {
      const row = btn.closest('.vac-range');
      if (!row) return;
      if (document.querySelectorAll('.vac-range').length === 1) {
        row.dataset.id = '';
        row.querySelector('.v-from').value = '';
        row.querySelector('.v-until').value = '';
        row.querySelector('.v-notes').value = '';
      } else row.remove();
      updateVacationDays();
    }
    if (act === 'vac-edit') {
      const vac = state.vacations.find((v) => v.id === btn.dataset.id);
      if (vac) vacationForm(vac.employeeId, null);
    }
    if (act === 'vac-open') { event.stopPropagation(); vacationDetail(btn.dataset.id); }
    if (act === 'vac-delete') {
      const vac = state.vacations.find((v) => v.id === btn.dataset.id);
      if (!vac || !confirm('Delete this vacation?')) return;
      state.vacations = state.vacations.filter((v) => v.id !== vac.id);
      applyVacations();
      save();
      closeOverlay();
      render();
      toast('Vacation deleted');
    }
    if (act === 'save-vac') saveVacationFromForm();
    if (act === 'cal-prev') {
      state.cal.m -= 1;
      if (state.cal.m < 0) { state.cal.m = 11; state.cal.y -= 1; }
      render();
    }
    if (act === 'cal-next') {
      state.cal.m += 1;
      if (state.cal.m > 11) { state.cal.m = 0; state.cal.y += 1; }
      render();
    }
    if (act === 'cal-day' && !event.target.closest('[data-act="vac-open"]')) vacationForm('', { employeeId: state.employees[0] ? state.employees[0].id : '', startDate: btn.dataset.date, endDate: btn.dataset.date, type: VACATION_TYPES[0], notes: '', id: '' });
    if (act === 'who') whoModal(btn.dataset.day, btn.dataset.block);
    if (act === 'affected') affectedModal(btn.dataset.day, btn.dataset.block);
    if (act === 'scroll-history') { const node = $('#vac-history'); if (node) node.scrollIntoView({ behavior: 'smooth' }); }
    if (act === 'notes') {
      const items = notifications();
      openOverlay(`<h2 style="margin-top:0">Notifications</h2>${items.length ? items.map((item) => `<div class="check"><span>${esc(item.text)}</span></div>`).join('') : '<p class="muted">You are caught up.</p>'}<button class="btn" type="button" data-act="close">Close</button>`, true);
    }
    if (act === 'settings') {
      openOverlay(`<h2 style="margin-top:0">Settings</h2>
        <div class="field"><label>Minimum manpower before a vacation warning</label><input id="set-min" type="number" min="1" max="40" value="${esc(state.settings.minManpower)}" /></div>
        <p class="muted">A warning appears when vacation pushes a block under this number.</p>
        <div class="actions"><button class="btn" type="button" data-act="json">Export data</button><button class="btn" type="button" data-act="import">Import data</button></div>
        <div class="actions" style="margin-top:10px"><button class="btn-ghost" type="button" data-act="reset">Reset master data</button><button class="btn-primary" type="button" data-act="save-settings">Save</button></div>`, true);
    }
    if (act === 'save-settings') {
      state.settings.minManpower = Math.max(1, Number($('#set-min').value) || 8);
      applyVacations();
      save();
      closeOverlay();
      render();
      toast('Settings saved');
    }
    if (act === 'excel') exportExcel();
    if (act === 'print') {
      if (!state.schedule) { toast('Generate a schedule first.'); return; }
      if (state.view !== 'schedule') {
        go('schedule');
        setTimeout(() => window.print(), 80);
        return;
      }
      window.print();
    }
    if (act === 'json') exportJson();
    if (act === 'import') $('#import-file').click();
    if (act === 'reset') {
      if (!confirm('Reset employees to the original roster? Vacations and the generated month on this browser will be cleared.')) return;
      state.employees = defaultEmployees();
      state.vacations = [];
      state.schedule = null;
      state.validation = null;
      state.warnings = [];
      state.generation = 0;
      state.lastSig = '';
      state.stale = false;
      save();
      closeOverlay();
      render();
    }
  }

  document.body.addEventListener('click', onClick);
  document.body.addEventListener('input', (event) => {
    if (event.target.classList && (event.target.classList.contains('v-from') || event.target.classList.contains('v-until'))) updateVacationDays();
    if (event.target.id === 'g-month') {
      const parts = String(event.target.value || '').split('-');
      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10) - 1;
      if ($('#g-week') && year && month >= 0) $('#g-week').textContent = `Every day in ${MONTHS[month]} ${year}.`;
    }
    if (event.target.id === 'emp-search') {
      state.filters.q = event.target.value;
      state.soft = true;
      render();
    }
  });
  document.body.addEventListener('change', (event) => {
    const map = { 'f-dept': 'dept', 'f-pos': 'pos', 'f-status': 'status', 'f-vac': 'vacation', 'f-off': 'offday' };
    if (map[event.target.id]) {
      state.filters[map[event.target.id]] = event.target.value;
      state.soft = true;
      render();
    }
    if (event.target.id === 'v-emp') paintVacationRanges(event.target.value);
    if (event.target.id === 'sched-month') state.pickMonth = parseInt(event.target.value, 10);
    if (event.target.id === 'sched-year') state.pickYear = parseInt(event.target.value, 10);
    if (event.target.id === 'sched-start' || event.target.id === 'g-start') state.settings.rotationStart = event.target.value;
    if (event.target.classList && (event.target.classList.contains('v-from') || event.target.classList.contains('v-until'))) updateVacationDays();
    if (event.target.id === 'e-mode') $('#fixed-wrap').hidden = event.target.value !== 'fixed';
    if (event.target.id === 'e-split') $('#split-times').hidden = !event.target.checked;
    if (event.target.id === 'e-pos' && !state.editingId) {
      const pos = event.target.value.toLowerCase();
      if (pos.includes('coordinator')) { $('#e-mode').value = 'friday-only'; $('#e-s1').value = '12:00'; $('#e-e1').value = '21:00'; $('#e-split').checked = false; }
      else if (pos.includes('test')) { $('#e-mode').value = 'fixed'; $('#e-s1').value = '09:00'; $('#e-e1').value = '18:00'; $('#e-split').checked = false; }
      else if (pos.includes('promot')) { $('#e-mode').value = 'flexible'; $('#e-s1').value = '12:00'; $('#e-e1').value = '21:00'; $('#e-split').checked = false; }
      else if (pos.includes('advisor')) { $('#e-mode').value = 'advisor-pool'; $('#e-s1').value = '12:00'; $('#e-e1').value = '21:00'; $('#e-split').checked = false; }
      $('#fixed-wrap').hidden = $('#e-mode').value !== 'fixed';
      $('#split-times').hidden = !$('#e-split').checked;
    }
    if (event.target.id === 'import-file' && event.target.files[0]) {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result || ''));
          if (!data || !Array.isArray(data.employees) || !data.employees.length) throw new Error('missing employees');
          state.employees = data.employees;
          state.vacations = Array.isArray(data.vacations) ? data.vacations : [];
          state.settings = { minManpower: 8, strategy: 'balanced', ...(data.settings || {}) };
          state.schedule = data.schedule || null;
          state.generation = data.generation || 0;
          state.lastSig = data.lastSig || '';
          applyVacations();
          save();
          closeOverlay();
          render();
          toast('Backup restored');
        } catch (err) {
          toast('That file is not a workforce backup.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }
  });
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeOverlay(); });
  window.addEventListener('resize', () => { if (state.view === 'dashboard') drawChart(); });
  window.addEventListener('hashchange', () => {
    const next = location.hash.replace('#', '');
    if (VIEWS.includes(next) && next !== state.view) go(next);
  });
  const chartMove = (event) => {
    const canvas = $('#man-chart');
    const tip = $('#chart-tip');
    if (!canvas || !tip || !canvas._layout) return;
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const { pad, group, series } = canvas._layout;
    const i = Math.floor((x - pad.l) / group);
    if (i < 0 || i > 6) { tip.style.opacity = 0; return; }
    tip.style.opacity = 1;
    tip.style.left = `${Math.min(rect.width - 140, Math.max(8, x + 12))}px`;
    tip.style.top = '12px';
    tip.innerHTML = `<b>${DAYS[i]}</b><br>${series.map((s) => `${esc(s.name)}: ${s.values[i]}`).join('<br>')}`;
  };
  document.body.addEventListener('mousemove', (event) => { if (event.target.id === 'man-chart') chartMove(event); });
  document.body.addEventListener('mouseleave', (event) => { if (event.target.id === 'man-chart') { const tip = $('#chart-tip'); if (tip) tip.style.opacity = 0; } }, true);

  load();
  if (syncAdvisorRoster()) {
    clearSchedule();
    save();
  }
  applyVacations();
  const hash = location.hash.replace('#', '');
  state.view = VIEWS.includes(hash) ? hash : 'dashboard';
  render();
})();
</script>
</body>
</html>
