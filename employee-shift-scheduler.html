<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workforce Control Center</title>
<style>
  :root {
    --bg: #f3f5f7;
    --card: #ffffff;
    --ink: #14181f;
    --muted: #667085;
    --line: #e6ebf1;
    --green: #0f6e56;
    --green-soft: #e8f6f1;
    --off: #667085;
    --off-soft: #f2f4f7;
    --vac: #3d4c9e;
    --vac-soft: #eef0fa;
    --warn: #b54708;
    --warn-soft: #fff6ed;
    --shadow: 0 10px 30px rgba(16, 24, 40, .06);
    --radius: 16px;
    --nav: 68px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 400px at 10% -10%, rgba(15, 110, 86, .08), transparent 50%),
      radial-gradient(900px 360px at 100% 0%, rgba(61, 76, 158, .06), transparent 46%),
      var(--bg);
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .topnav {
    position: sticky; top: 0; z-index: 30;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "brand links tools";
    align-items: center; gap: 14px;
    min-height: var(--nav); padding: 10px 22px;
    background: rgba(255, 255, 255, .92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
  }
  .brand { grid-area: brand; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }
  .mark {
    width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center;
    background: linear-gradient(160deg, #1a4f45, #102820);
    color: white; flex: 0 0 auto;
  }
  .brand strong { display: block; font-size: 13px; letter-spacing: .14em; }
  .brand em { display: block; font-style: normal; font-size: 11px; letter-spacing: .16em; color: var(--muted); }
  .nav-links { grid-area: links; display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links button {
    border: 0; background: transparent; color: #3f4854;
    padding: 8px 12px; border-radius: 999px; white-space: nowrap;
    transition: background .18s, color .18s;
  }
  .nav-links button:hover { background: #f2f4f7; }
  .nav-links button.on { background: #14181f; color: white; }
  .nav-right { grid-area: tools; display: flex; align-items: center; gap: 8px; }
  .today-chip { color: var(--muted); font-size: 13px; padding-right: 6px; white-space: nowrap; }
  .icon-btn, .btn, .btn-primary, .btn-ghost {
    border-radius: 999px; border: 1px solid var(--line); background: white;
    padding: 8px 14px; transition: transform .18s, box-shadow .18s, background .18s;
  }
  .icon-btn { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; position: relative; }
  .icon-btn:hover, .btn:hover, .btn-ghost:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .btn-primary {
    border: 0; color: white; padding: 10px 16px;
    background: linear-gradient(180deg, #1c564b, #123f37);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(18, 63, 55, .25); }
  .btn-primary.small { padding: 6px 10px; font-size: 13px; }
  .btn-ghost { background: transparent; }
  .btn.small, .btn-ghost.small { padding: 6px 10px; font-size: 13px; }
  .badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px;
    background: #b54708; color: white; font-size: 11px; display: grid; place-items: center;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 72px; }
  .page-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; }
  .kicker { margin: 0 0 6px; color: var(--muted); letter-spacing: .12em; font-size: 12px; text-transform: uppercase; }
  h1 { margin: 0; font-size: 32px; letter-spacing: -.03em; font-weight: 650; }
  .sub { margin: 6px 0 0; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid-5, .grid-4, .grid-2 { display: grid; gap: 14px; }
  .grid-5 { grid-template-columns: repeat(5, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-2 { grid-template-columns: 1.4fr .8fr; }
  .card {
    background: var(--card); border: 1px solid rgba(255,255,255,.8);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px;
  }
  .kpi .lbl, .stat .lbl { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
  .kpi .val, .stat .val { font-size: 34px; letter-spacing: -.04em; margin-top: 8px; font-weight: 650; }
  .kpi .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .section-title { margin: 26px 0 12px; font-size: 13px; letter-spacing: .12em; color: #3f4854; }
  .stat { min-height: 118px; }
  .band { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .chart-card { margin-top: 14px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; }
  .seg button { border: 1px solid var(--line); background: #f8fafb; border-radius: 999px; padding: 7px 12px; }
  .seg button.on { background: #14181f; color: white; border-color: #14181f; }
  .legend { display: flex; gap: 14px; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 6px; }
  canvas#man-chart { width: 100%; height: 280px; display: block; }
  .tip {
    position: absolute; pointer-events: none; background: #14181f; color: white;
    padding: 8px 10px; border-radius: 10px; font-size: 12px; opacity: 0; transition: opacity .15s;
  }
  .chart-wrap { position: relative; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters input, .filters select, .field input, .field select, .field textarea {
    border: 1px solid var(--line); background: white; border-radius: 12px; padding: 10px 12px; outline: none;
  }
  .filters input { min-width: 220px; flex: 1; }
  .filters input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: #9aa8b8; box-shadow: 0 0 0 4px rgba(20, 24, 31, .05); }
  .emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .emp-card { padding: 18px; display: flex; flex-direction: column; gap: 8px; transition: transform .18s, box-shadow .18s; }
  .emp-card:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(16, 24, 40, .08); }
  .emp-top { display: flex; gap: 12px; align-items: center; }
  .avatar {
    width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
    font-weight: 650; color: #143d36; background: #e7f3ef; flex: 0 0 auto;
  }
  .avatar.sm { width: 36px; height: 36px; border-radius: 12px; font-size: 12px; }
  .emp-top b { display: block; }
  .muted, .emp-top small, .who small { color: var(--muted); }
  .meta { font-size: 13px; color: #3f4854; line-height: 1.45; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border-radius: 999px; padding: 4px 8px; background: var(--green-soft); color: var(--green); }
  .pill.off { background: var(--off-soft); color: var(--off); }
  .pill.vac { background: var(--vac-soft); color: var(--vac); }
  .emp-card .actions { margin-top: auto; padding-top: 8px; }
  .board-scroll { overflow: auto; max-height: calc(100vh - 230px); border-radius: 18px; border: 1px solid var(--line); background: white; box-shadow: var(--shadow); }
  table.sheet { border-collapse: separate; border-spacing: 0; min-width: 980px; width: 100%; }
  .sheet th, .sheet td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; background: white; }
  .sheet thead th { position: sticky; top: 0; z-index: 2; font-size: 12px; letter-spacing: .06em; color: var(--muted); text-align: left; background: #fbfcfd; }
  .sheet .who { position: sticky; left: 0; z-index: 1; min-width: 240px; max-width: 280px; }
  .sheet thead .who { z-index: 3; }
  .who-box { display: flex; gap: 10px; align-items: center; }
  .who-box > span { min-width: 0; }
  .who-box b, .who small { display: block; line-height: 1.3; }
  .cell-card { border-radius: 12px; padding: 10px 8px; min-height: 78px; text-align: center; }
  .cell-card b { display: block; font-size: 11px; letter-spacing: .08em; margin-bottom: 4px; }
  .cell-card span { display: block; font-size: 12px; }
  .cell-card.work { background: var(--green-soft); color: #0b5c48; }
  .cell-card.off { background: var(--off-soft); color: #526071; }
  .cell-card.vacation { background: var(--vac-soft); color: var(--vac); }
  .health { display: flex; gap: 16px; align-items: center; }
  .ring { width: 92px; height: 92px; }
  .ring-bg { fill: none; stroke: #e7ebf0; stroke-width: 8; }
  .ring-fg { fill: none; stroke: var(--green); stroke-width: 8; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 44px 44px; }
  .ring text { font-size: 16px; font-weight: 650; fill: var(--ink); transform: none; }
  .warn {
    background: var(--warn-soft); border: 1px solid #f5d7bd; color: #8a3b0c;
    border-radius: 14px; padding: 14px 16px; margin: 12px 0;
  }
  .warn b { letter-spacing: .06em; }
  .heat { width: 100%; border-collapse: separate; border-spacing: 8px; }
  .heat th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .heat-cell, .heat-closed {
    width: 100%; min-height: 74px; border-radius: 14px; border: 0;
    font-size: 22px; font-weight: 650; transition: transform .18s;
  }
  .heat-cell:hover { transform: translateY(-2px); }
  .heat-closed { background: #eef1f4; color: #98a2b3; font-size: 16px; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-dow { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: .06em; }
  .cal-day { min-height: 108px; border-radius: 14px; background: white; border: 1px solid var(--line); padding: 8px; text-align: left; cursor: pointer; font: inherit; }
  .cal-day.out { opacity: .45; }
  .cal-day.today { outline: 2px solid #143d36; }
  .cal-day .n { font-size: 12px; color: var(--muted); }
  .chip {
    display: block; width: 100%; text-align: left; margin-top: 4px; border: 0; border-radius: 8px;
    padding: 4px 6px; font-size: 11px; background: var(--vac-soft); color: var(--vac);
  }
  .chip.t-annual { background: #eef0fa; color: #3d4c9e; }
  .chip.t-emergency { background: #fff4e8; color: #9a5410; }
  .chip.t-sick { background: #fdecec; color: #8d3a3a; }
  .chip.t-personal { background: #e8f6f1; color: #0f6e56; }
  .chip.t-training { background: #eef3f8; color: #3d5270; }
  .chip.t-other { background: #f2f4f7; color: #526071; }
  table.list { width: 100%; border-collapse: collapse; }
  table.list th, table.list td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
  table.list th { color: var(--muted); font-size: 12px; letter-spacing: .06em; }
  .empty {
    text-align: center; padding: 48px 16px; color: var(--muted);
  }
  .empty svg { margin-bottom: 8px; }
  .empty h3 { margin: 8px 0; color: var(--ink); letter-spacing: .08em; }
  .rule { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .rule + .rule { margin-top: 12px; }
  .scrim {
    position: fixed; inset: 0; z-index: 40; background: rgba(16, 20, 24, .35);
    display: grid; place-items: center; padding: 22px;
    animation: fade .18s ease;
  }
  .dialog, .drawer {
    background: white; border-radius: 20px; box-shadow: 0 24px 60px rgba(16, 24, 40, .18);
    width: min(560px, 100%); max-height: min(86vh, 820px); overflow: auto; padding: 22px;
    animation: rise .22s ease;
  }
  .drawer { width: min(420px, 100%); margin-left: auto; height: 100%; max-height: none; border-radius: 20px 0 0 20px; }
  .scrim.drawer-scrim { place-items: stretch end; padding: 0; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field.row { flex-direction: row; gap: 10px; }
  .field.row > div { flex: 1; }
  .days { display: flex; flex-wrap: wrap; gap: 8px; }
  .days label { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 13px; }
  .step { padding: 8px 0; color: var(--muted); }
  .step.on { color: var(--ink); font-weight: 650; }
  .step.done { color: var(--green); }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #14181f; color: white; padding: 10px 14px; border-radius: 999px;
    z-index: 50; font-size: 13px;
  }
  .menu { position: relative; }
  .menu summary { list-style: none; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu-pop {
    position: absolute; right: 0; top: calc(100% + 6px); background: white;
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    min-width: 180px; padding: 6px; z-index: 5;
  }
  .menu-pop button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 8px 10px; }
  .menu-pop button:hover { background: #f4f6f8; }
  .check { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (max-width: 1100px) {
    .topnav {
      grid-template-columns: 1fr auto;
      grid-template-areas: "brand tools" "links links";
      row-gap: 6px;
    }
  }
  @media (max-width: 980px) {
    .grid-5, .grid-4, .band, .grid-2 { grid-template-columns: 1fr 1fr; }
    h1 { font-size: 26px; }
  }
  @media (max-width: 720px) {
    .topnav { padding: 10px; }
    .grid-5, .grid-4, .band, .grid-2 { grid-template-columns: 1fr; }
    .brand { min-width: 0; }
    .today-chip { display: none; }
    .cal-day { min-height: 78px; }
    .wrap { padding: 18px 12px 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media print {
    .topnav, .actions, .filters, .scrim, .toast { display: none !important; }
    body { background: white; }
    .board-scroll { max-height: none; overflow: visible; box-shadow: none; }
  }
</style>
</head>
<body>
<header class="topnav">
  <button class="brand" type="button" data-go="dashboard">
    <span class="mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="5" width="18" height="16" rx="2"></rect>
        <path d="M3 10h18M8 3v4M16 3v4"></path>
      </svg>
    </span>
    <span><strong>WORKFORCE</strong><em>CONTROL CENTER</em></span>
  </button>
  <nav class="nav-links" aria-label="Primary">
    <button type="button" data-go="dashboard">Dashboard</button>
    <button type="button" data-go="employees">Employees</button>
    <button type="button" data-go="schedule">Schedule</button>
    <button type="button" data-go="manpower">Manpower</button>
    <button type="button" data-go="vacations">Vacations</button>
    <button type="button" data-go="rules">Rules</button>
  </nav>
  <div class="nav-right">
    <span class="today-chip" id="today-label"></span>
    <button class="icon-btn" type="button" data-act="notes" aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
      <span class="badge" id="note-badge" hidden>0</span>
    </button>
    <button class="icon-btn" type="button" data-act="settings" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"></path></svg>
    </button>
  </div>
</header>
<main id="main"></main>
<div id="overlay"></div>
<div id="toast" hidden></div>
<input id="import-file" type="file" accept="application/json,.json" hidden />

<script>
(() => {
  const DAYS = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  const WEEKDAYS = DAYS.slice(0, 6);
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const BLOCKS = [
    { id: 'am', label: '9 AM – 12 PM', short: '9–12', start: 9 * 60, end: 12 * 60 },
    { id: 'mid', label: '12 PM – 5 PM', short: '12–5', start: 12 * 60, end: 17 * 60 },
    { id: 'pm', label: '5 PM – 9 PM', short: '5–9', start: 17 * 60, end: 21 * 60 },
  ];
  const ROLES = [
    ['advisor', 'Sales Advisors'],
    ['promoter', 'Promoters'],
    ['testdrive', 'Test Drive'],
    ['coordinator', 'Coordinator'],
  ];
  const VACATION_TYPES = ['Annual Vacation', 'Emergency Vacation', 'Sick Leave', 'Personal Leave', 'Training', 'Other'];
  const VIEWS = ['dashboard', 'employees', 'schedule', 'manpower', 'vacations', 'rules'];
  const KEY = 'wcc-store-v1';
  const LEGACY_KEY = 'employee-shift-scheduler-v1';
  const CHECKS = [
    ['friday', 'Friday OFF for everyone'],
    ['vacation', 'Vacation respected'],
    ['fixed', 'Fixed off days respected'],
    ['shifts', 'Correct shifts'],
    ['split', 'Split shifts respected'],
    ['conflict', 'No conflicting shifts'],
    ['workvac', 'No employee scheduled while on vacation'],
    ['pool', 'Thursday/Saturday advisor distribution'],
    ['coverage', 'Required employee coverage'],
    ['duplicate', 'No duplicate assignment'],
  ];

  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function defaultEmployees() {
    const row = (id, name, department, position, offMode, shifts, fixedOffDays) => ({
      id, name, department, position, offMode, shifts, fixedOffDays: fixedOffDays || ['Friday'], notes: '',
    });
    const noon = [{ start: '12:00', end: '21:00' }];
    const day = [{ start: '09:00', end: '18:00' }];
    const omar = [{ start: '08:50', end: '12:45' }, { start: '17:00', end: '21:00' }];
    const ali = [{ start: '09:00', end: '13:00' }, { start: '17:00', end: '21:00' }];
    return [
      row('49099', 'Ruba Hamed Albarakati', 'Delivery', 'Sales Coordinator', 'friday-only', noon),
      row('49973', 'Ghadeer Abdulhadi Attia Altayyari', 'SA Showroom', 'Sales Advisor', 'advisor-pool', noon),
      row('50093', 'Lujen Sami Saeed Bazhair', 'SA Showroom', 'Sales Advisor', 'advisor-pool', noon),
      row('47674', 'Mansour Alqahtani', 'Toyota Sales', 'Sales Advisor', 'advisor-pool', noon),
      row('48476', 'Ali Muharraq A. Alharbi', 'SA Showroom', 'Sales Advisor', 'flexible', ali),
      row('50345', 'Muteb Abdullah Nasser AlShehri', 'SA Showroom', 'Sales Advisor', 'advisor-pool', noon),
      row('50822', 'Ahmed Saleh Binmahfoodh', 'SA Showroom', 'Sales Advisor', 'advisor-pool', noon),
      row('50338', 'Ahmed Yousef Alftini', 'SA Showroom', 'Sales Advisor', 'flexible', day),
      row('50648', 'Omar Mohammad Mahlawi', 'Showroom', 'Promoters', 'friday-only', omar),
      row('50649', 'Shuruq Abdulagani Alansari', 'Showroom', 'Promoters', 'friday-only', omar.map((s) => ({ ...s }))),
      row('50650', 'Fahad Ali Alshahrani', 'Showroom', 'Promoters', 'fixed', noon, ['Thursday', 'Friday']),
      row('50651', 'Haifa Ibrahim Alhasani', 'Showroom', 'Promoters', 'friday-only', noon),
      row('50652', 'Shahad Mastour Almutairi', 'Showroom', 'Promoters', 'flexible', noon),
      row('50623', 'Saleh Abdullah Alsubaie', 'Showroom', 'Test Drive', 'fixed', day, ['Saturday', 'Friday']),
    ];
  }

  const now = new Date();
  const state = {
    view: 'dashboard',
    employees: [],
    vacations: [],
    settings: { minManpower: 8, strategy: 'balanced' },
    schedule: null,
    generation: 0,
    lastSig: '',
    sameArrangement: false,
    stale: false,
    validation: null,
    warnings: [],
    filters: { q: '', dept: '', pos: '', status: '', vacation: '', offday: '' },
    chartRole: 'total',
    heatRole: 'total',
    cal: { y: now.getFullYear(), m: now.getMonth() },
    soft: false,
    busy: false,
    editingId: '',
  };

  function toMin(hhmm) {
    const [h, m] = String(hhmm || '0:0').split(':').map((n) => parseInt(n, 10) || 0);
    return h * 60 + m;
  }

  function generateSchedule(employees, seed, week, vacations, strategy, minManpower) {

  function validateSchedule() {
    const issues = [];

    const seen = new Set();
    state.schedule.rows.forEach((row) => {
      const key = `${row.employeeId}:${row.day}`;

    } else if (emp.offMode === 'flexible') {
      offs = 'Friday OFF · one extra weekday OFF';
      mode = 'Flexible';
    }
    return { hours, offs, mode };
  }
  function statusOf(emp) {
    const today = iso(new Date());
    if (vacationOn(emp.id, today)) return { cls: 'vac', text: 'On vacation' };
    const row = state.schedule && state.schedule.rows.find((r) => r.employeeId === emp.id && r.date === today);
    if (row && row.status === 'off') return { cls: 'off', text: 'Off today' };
    return { cls: '', text: 'Active' };
  }
  function matchesFilters(emp) {
    const f = state.filters;
    const q = f.q.trim().toLowerCase();
    if (q && !`${emp.name} ${emp.id} ${emp.position} ${emp.department}`.toLowerCase().includes(q)) return false;
    if (f.dept && emp.department !== f.dept) return false;
    if (f.pos && emp.position !== f.pos) return false;
    const status = statusOf(emp).text;
    if (f.status === 'active' && status !== 'Active') return false;
    if (f.status === 'off' && status !== 'Off today') return false;
    if (f.status === 'vacation' && status !== 'On vacation') return false;
    const mine = vacationsFor(emp.id);
    const today = iso(new Date());
    const hasUpcoming = mine.some((v) => v.startDate > today);
    const onVac = mine.some((v) => v.startDate <= today && v.endDate >= today);
    if (f.vacation === 'none' && mine.length) return false;
    if (f.vacation === 'upcoming' && !hasUpcoming) return false;
    if (f.vacation === 'active' && !onVac) return false;
    if (f.offday === 'friday' && emp.offMode !== 'friday-only') return false;
    if (f.offday === 'flexible' && emp.offMode !== 'flexible') return false;
    if (f.offday === 'thursday' || f.offday === 'saturday') {
      const day = f.offday === 'thursday' ? 'Thursday' : 'Saturday';
      const fixed = emp.offMode === 'fixed' && (emp.fixedOffDays || []).includes(day);
      const row = rowFor(emp.id, day);
      if (!fixed && !(row && row.offReason === 'generated')) return false;
    }
    return true;
  }
  function vacationLine(emp) {
    const today = iso(new Date());
    const active = vacationsFor(emp.id).find((v) => v.startDate <= today && v.endDate >= today);
    if (active) return active.type;
    const next = vacationsFor(emp.id).find((v) => v.startDate > today);
    if (next) return `Upcoming ${fmtShort(next.startDate)}`;
    return 'None';
  }

  function ring(pct) {
    const r = 36;
    const c = 2 * Math.PI * r;
    const dash = (Math.max(0, Math.min(100, pct)) / 100) * c;
    return `<svg class="ring" viewBox="0 0 88 88" aria-hidden="true"><circle class="ring-bg" cx="44" cy="44" r="${r}"></circle><circle class="ring-fg" cx="44" cy="44" r="${r}" stroke-dasharray="${dash} ${c - dash}"></circle><text x="44" y="49" text-anchor="middle">${pct}%</text></svg>`;
  }
  function emptyBlock(title, text, button) {
    return `<div class="card empty"><svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#98a2b3" stroke-width="1.6"><rect x="8" y="12" width="48" height="42" rx="8"></rect><path d="M8 24h48M20 8v8M44 8v8"></path></svg><h3>${title}</h3><p>${text}</p>${button || ''}</div>`;
  }
  function pageHead(title, sub, actions) {
    return `<div class="page-head"><div><h1>${title}</h1>${sub ? `<p class="sub" id="page-sub">${sub}</p>` : ''}</div><div class="actions">${actions || ''}</div></div>`;
  }
  function exportMenu() {
    return `<details class="menu"><summary class="btn">Export</summary><div class="menu-pop"><button type="button" data-act="excel">Excel workbook</button><button type="button" data-act="print">Print / PDF</button><button type="button" data-act="json">JSON backup</button></div></details>`;
  }
  function warnHtml() {
    if (!state.warnings.length) return '';
    return state.warnings.slice(0, 4).map((w) => `<article class="warn"><b>MANPOWER WARNING</b><p>${esc(w.day)} · ${esc(w.label)}</p><p>Required ${w.required} · Available ${w.available} · Shortage ${w.shortage}</p><p>Reason: ${w.people.length} employee${w.people.length === 1 ? '' : 's'} on vacation would have covered this block.</p><button class="btn small" type="button" data-act="affected" data-day="${esc(w.day)}" data-block="${esc(w.blockId)}">View affected employees</button></article>`).join('');
  }
  function healthCard() {
    if (!state.schedule || !state.validation) {
      return `<article class="card health"><div><b>SCHEDULE HEALTH</b><p class="muted">Generate a week to validate it.</p></div></article>`;
    }
    const health = state.validation.health;
    const n = state.validation.issues.length;
    const label = health === 100 ? '100% VALID' : `${n} ISSUE${n === 1 ? '' : 'S'}`;
    return `<article class="card health">${ring(health)}<div><b>SCHEDULE HEALTH</b><p>${label}</p>${n ? '<button class="btn small" type="button" data-act="issues">View issues</button>' : '<p class="muted">Every check passed.</p>'}</div></article>`;
  }

  function dashboardView() {
    const list = state.employees;
    const count = (key) => list.filter((e) => roleKey(e.position) === key).length;
    const kpis = [
      ['TOTAL EMPLOYEES', list.length, 'On the roster'],
      ['SALES ADVISORS', count('advisor'), 'Sales Advisor'],
      ['PROMOTERS', count('promoter'), 'Promoters'],
      ['TEST DRIVE', count('testdrive'), 'Test Drive'],
      ['COORDINATOR', count('coordinator'), 'Sales Coordinator'],
    ];
    const today = todayStats();
    const num = (n) => (n == null ? '—' : `<span data-count="${n}">0</span>`);
    const stats = [
      ['WORKING TODAY', num(today.work)],
      ['ON VACATION', num(today.vac)],
      ['OFF TODAY', num(today.off)],
      ['TOTAL MANPOWER', num(today.total)],
    ];
    const chart = state.schedule
      ? `<div class="chart-wrap"><canvas id="man-chart"></canvas><div class="tip" id="chart-tip"></div></div><div class="legend"><span><i class="dot" style="background:#0f6e56"></i>Morning</span><span><i class="dot" style="background:#3d4f7c"></i>Afternoon</span><span><i class="dot" style="background:#8aa0b8"></i>Evening</span></div>`
      : emptyBlock('NO SCHEDULE GENERATED', 'Generate a week to see manpower by day and block.', '<button class="btn-primary" type="button" data-act="open-generate">Generate schedule</button>');
    const roles = [['total', 'Total Manpower'], ['advisor', 'Sales Advisors'], ['promoter', 'Promoters'], ['testdrive', 'Test Drive'], ['coordinator', 'Coordinator']];
    return `<div class="wrap">

      <div class="grid-5">${kpis.map(([lbl, val, hint]) => `<article class="card kpi"><div class="lbl">${lbl}</div><div class="val" data-count="${val}">0</div><div class="hint">${hint}</div></article>`).join('')}</div>
      <h2 class="section-title">This week</h2>

      ${today.outside ? '<p class="muted">Today sits outside the generated week. Open Schedule to review that week.</p>' : ''}
      <h2 class="section-title">Manpower overview</h2>
      <article class="card chart-card">
        <div class="seg">${roles.map(([id, label]) => `<button type="button" class="${state.chartRole === id ? 'on' : ''}" data-act="chart" data-role="${id}">${label}</button>`).join('')}</div>
        ${chart}
      </article>
      ${warnHtml()}
      <div class="grid-2" style="margin-top:14px">${healthCard()}<article class="card"><b>NEXT VACATION</b>${nextVacationHtml()}</article></div>
    </div>`;
  }
  function nextVacationHtml() {
    const today = iso(new Date());
    const next = state.vacations.filter((v) => v.startDate >= today).sort((a, b) => a.startDate.localeCompare(b.startDate))[0]
      || upcomingList()[0];
    if (!next) return '<p class="muted">No vacation is scheduled.</p>';
    const emp = empById(next.employeeId);
    return `<p style="font-size:22px;margin:10px 0 0">${esc(emp ? emp.name : next.employeeId)}</p><p class="muted">${esc(next.type)} · ${fmtShort(next.startDate)} – ${fmtShort(next.endDate)}</p>`;
  }

  function employeeCards() {
    const people = state.employees.filter(matchesFilters);
    if (!people.length) return '<div class="card empty"><h3>NO MATCHING EMPLOYEES</h3><p>Try another search or filter.</p></div>';
    return people.map((emp) => {
      const shifts = normalizeShifts(emp);

      const rule = ruleSummary(emp);
      return `<article class="card emp-card">
        <div class="emp-top"><span class="avatar">${esc(initials(emp.name))}</span><div><b>${esc(emp.name)}</b><small>ID ${esc(emp.id)} · ${esc(emp.department)}</small></div></div>

  function employeesView() {

        <select id="f-vac"><option value="">Vacation</option><option value="none" ${state.filters.vacation === 'none' ? 'selected' : ''}>None</option><option value="upcoming" ${state.filters.vacation === 'upcoming' ? 'selected' : ''}>Upcoming</option><option value="active" ${state.filters.vacation === 'active' ? 'selected' : ''}>On vacation</option></select>
        <select id="f-off"><option value="">Off day</option><option value="friday" ${state.filters.offday === 'friday' ? 'selected' : ''}>Friday only</option><option value="thursday" ${state.filters.offday === 'thursday' ? 'selected' : ''}>Thursday</option><option value="saturday" ${state.filters.offday === 'saturday' ? 'selected' : ''}>Saturday</option><option value="flexible" ${state.filters.offday === 'flexible' ? 'selected' : ''}>Flexible</option></select>
      </div>
      <div class="emp-grid" id="emp-grid">${employeeCards()}</div>

  function cellCard(row) {
    if (!row) return '<div class="cell-card off"><b>OFF</b><span>—</span></div>';
    if (row.status === 'vacation') return `<div class="cell-card vacation"><b>VACATION</b><span>${esc(row.vacation ? row.vacation.type : 'Vacation')}</span></div>`;
    if (row.status === 'off') return `<div class="cell-card off"><b>OFF</b><span>${esc(offLabel(row))}</span></div>`;
    if (row.kind === 'split') return `<div class="cell-card work"><b>SPLIT SHIFT</b>${row.shifts.map((s) => `<span>${esc(s.label)}</span>`).join('')}</div>`;
    return `<div class="cell-card work"><b>WORK</b>${row.shifts.map((s) => `<span>${esc(s.label)}</span>`).join('')}</div>`;
  }
  function scheduleView() {
    const period = state.schedule ? `${fmtShort(state.schedule.start)} – ${fmtLong(state.schedule.end)}` : 'No week generated';
    const same = state.sameArrangement ? ' Flexible off days stayed in the same places.' : '';
    const meta = state.schedule ? `Arrangement #${state.generation}. Strategy: ${state.schedule.strategy || 'balanced'}.${same}` : (state.stale ? 'Rules changed. Generate the week again.' : '');
    const board = !state.schedule
      ? emptyBlock('NO SCHEDULE GENERATED', 'Choose a week and the generator will apply every rule, off day, and vacation.', '<button class="btn-primary" type="button" data-act="open-generate">Generate schedule</button>')
      : `<div class="board-scroll"><table class="sheet"><thead><tr><th class="who">Employee</th>${DAYS.map((d, i) => `<th>${d}<br><span style="font-weight:500">${state.schedule.week[i] ? fmtShort(state.schedule.week[i].key) : ''}</span></th>`).join('')}</tr></thead><tbody>${
        state.employees.map((emp) => `<tr><td class="who"><div class="who-box"><span class="avatar sm">${esc(initials(emp.name))}</span><span><b>${esc(emp.name)}</b><small>${esc(emp.position)}</small></span></div></td>${DAYS.map((day) => `<td>${cellCard(rowFor(emp.id, day))}</td>`).join('')}</tr>`).join('')
      }</tbody></table></div>`;
    return `<div class="wrap">
      ${pageHead('Schedule', period, `<button class="btn-primary" type="button" data-act="open-generate">Generate schedule</button><button class="btn" type="button" data-act="regen">Regenerate</button><button class="btn" type="button" data-act="validate">Validate</button>${exportMenu()}`)}
      <p class="muted">${esc(meta)}</p>
      <div class="legend" style="margin:10px 0 14px"><span><i class="dot" style="background:#0f6e56"></i>Work</span><span><i class="dot" style="background:#98a2b3"></i>Off</span><span><i class="dot" style="background:#3d4c9e"></i>Vacation</span></div>
      ${healthCard()}
      ${warnHtml()}
      <div style="margin-top:14px">${board}</div>

  }

  function manpowerView() {
    const coverage = buildCoverage();
    if (!coverage.length) {
      return `<div class="wrap">${pageHead('Manpower', 'Control tower')}${emptyBlock('NO SCHEDULE GENERATED', 'Manpower is counted from the generated week.', '<button class="btn-primary" type="button" data-act="open-generate">Generate schedule</button>')}</div>`;
    }
    const roles = [['total', 'Total'], ...ROLES];
    let max = 1;
    coverage.forEach((day) => day.blocks.forEach((block) => { max = Math.max(max, displayedCount(block, state.heatRole)); }));
    const head = BLOCKS.map((b) => `<th>${esc(b.short)}<br>${esc(b.label)}</th>`).join('');
    const body = coverage.map((day) => {
      const cells = day.blocks.map((block) => {
        const n = displayedCount(block, state.heatRole);
        if (day.closed) return `<td><button class="heat-closed" type="button" data-act="who" data-day="${esc(day.day)}" data-block="${esc(block.id)}">0</button></td>`;
        const color = heatColor(n, max);
        const ink = n > max * 0.62 ? '#fff' : '#143d36';
        return `<td><button class="heat-cell" type="button" style="background:${color};color:${ink}" data-act="who" data-day="${esc(day.day)}" data-block="${esc(block.id)}">${n}</button></td>`;
      }).join('');
      return `<tr><th>${esc(day.day)}</th>${cells}</tr>`;
    }).join('');
    return `<div class="wrap">
      ${pageHead('Manpower', state.schedule ? `${fmtShort(state.schedule.start)} – ${fmtLong(state.schedule.end)}` : '', exportMenu())}
      <div class="seg">${roles.map(([id, label]) => `<button type="button" class="${state.heatRole === id ? 'on' : ''}" data-act="heat" data-role="${id}">${label}</button>`).join('')}</div>
      <article class="card" style="overflow:auto"><table class="heat"><thead><tr><th>Day</th>${head}</tr></thead><tbody>${body}</tbody></table><p class="muted">Friday stays closed. Select a cell to see who is working.</p></article>
      ${warnHtml()}
    </div>`;
  }

  function calendarCells() {
    const { y, m } = state.cal;
    const first = new Date(y, m, 1);
    const start = addDays(first, -((first.getDay() + 1) % 7));
    let html = '';
    for (let i = 0; i < 42; i += 1) {
      const date = addDays(start, i);
      const key = iso(date);
      const outside = date.getMonth() !== m;
      const today = key === iso(new Date());
      const items = state.vacations.filter((v) => v.startDate <= key && v.endDate >= key);
      const chips = items.slice(0, 2).map((v) => {
        const emp = empById(v.employeeId);
        return `<button class="chip ${typeClass(v.type)}" type="button" data-act="vac-open" data-id="${esc(v.id)}">${esc(emp ? emp.name.split(' ')[0] : 'Leave')}<br>${esc(v.type)}</button>`;
      }).join('');
      const more = items.length > 2 ? `<span class="muted">+${items.length - 2}</span>` : '';
      html += `<div class="cal-day ${outside ? 'out' : ''} ${today ? 'today' : ''}" data-act="cal-day" data-date="${key}"><span class="n">${date.getDate()}</span>${chips}${more}</div>`;
    }
    return html;
  }
  function vacationsView() {
    const today = iso(new Date());
    const upcoming = state.vacations.filter((v) => v.startDate > today);
    const next = state.vacations.filter((v) => v.endDate >= today).sort((a, b) => a.startDate.localeCompare(b.startDate))[0];
    const nextEmp = next ? empById(next.employeeId) : null;
    const kpis = [
      ['EMPLOYEES ON VACATION', onVacationToday()],
      ['UPCOMING VACATIONS', upcoming.length],
      ['VACATION DAYS THIS MONTH', monthVacationDays(state.cal.y, state.cal.m)],
      ['NEXT VACATION', next ? esc(nextEmp ? nextEmp.name : next.employeeId) : '—'],
    ];
    const list = upcomingList();
    const table = list.length
      ? `<table class="list"><thead><tr><th>Employee</th><th>Type</th><th>Start</th><th>End</th><th>Days</th><th>Status</th></tr></thead><tbody>${list.map((v) => {
        const emp = empById(v.employeeId);
        return `<tr><td><button class="btn-ghost small" type="button" data-act="vac-open" data-id="${esc(v.id)}">${esc(emp ? emp.name : v.employeeId)}</button></td><td>${esc(v.type)}</td><td>${fmtShort(v.startDate)}</td><td>${fmtShort(v.endDate)}</td><td>${inclusiveDays(v.startDate, v.endDate)}</td><td>${vacStatus(v)}</td></tr>`;
      }).join('')}</tbody></table>`
      : '';
    const body = state.vacations.length
      ? `<article class="card"><div class="cal-head"><button class="btn small" type="button" data-act="cal-prev">Previous</button><b>${MONTHS[state.cal.m].toUpperCase()} ${state.cal.y}</b><button class="btn small" type="button" data-act="cal-next">Next</button></div><div class="cal-grid">${DAYS.map((d) => `<div class="cal-dow">${d.slice(0, 3).toUpperCase()}</div>`).join('')}${calendarCells()}</div></article><h2 class="section-title">Upcoming vacations</h2><article class="card">${table || '<p class="muted">Nothing upcoming.</p>'}</article>`
      : emptyBlock('NO VACATIONS SCHEDULED', 'Add a leave period for any employee. The next generated week will keep them off those dates.', '<button class="btn-primary" type="button" data-act="vac-add">+ Add vacation</button>');
    return `<div class="wrap">
      ${pageHead('Vacations', 'Leave calendar', '<button class="btn-primary" type="button" data-act="vac-add">+ Add vacation</button>')}
      <div class="grid-4">${kpis.map(([lbl, val], i) => `<article class="card kpi"><div class="lbl">${lbl}</div><div class="${i === 3 ? 'meta' : 'val'}" ${i < 3 ? `data-count="${val}"` : ''} style="${i === 3 ? 'font-size:18px;margin-top:10px' : ''}">${i === 3 ? val : '0'}</div>${i === 3 && next ? `<div class="hint">${fmtShort(next.startDate)}</div>` : ''}</article>`).join('')}</div>
      <div style="margin-top:14px">${body}</div>
    </div>`;
  }

  function rulesView() {
    const cards = state.employees.map((emp) => {
      const rule = ruleSummary(emp);
      const extra = state.schedule ? DAYS.filter((d) => { const row = rowFor(emp.id, d); return row && row.offReason === 'generated'; }) : [];
      return `<article class="card rule"><div><b>${esc(emp.name)}</b><p class="muted">${esc(emp.position)} · ${esc(emp.id)}</p><p>Shift: ${esc(rule.hours)}</p><p>Friday: OFF</p><p>Additional off: ${esc(rule.offs)}</p><p>Vacation: Allowed${vacationsFor(emp.id).length ? ` · ${vacationsFor(emp.id).length} period${vacationsFor(emp.id).length === 1 ? '' : 's'}` : ''}</p>${extra.length ? `<p>This week: ${esc(extra.join(', '))} OFF</p>` : ''}${emp.notes ? `<p>${esc(emp.notes)}</p>` : ''}</div><button class="btn small" type="button" data-act="edit" data-id="${esc(emp.id)}">Edit</button></article>`;

    return `<div class="wrap">${pageHead('Rules', 'Mandatory rules win over balancing.', '<button class="btn-primary" type="button" data-act="add-employee">+ Add employee</button>')}<div class="emp-grid" style="grid-template-columns:1fr">${cards}</div></div>`;

  const views = { dashboard: dashboardView, employees: employeesView, schedule: scheduleView, manpower: manpowerView, vacations: vacationsView, rules: rulesView };

  function renderChrome() {
    document.querySelectorAll('[data-go]').forEach((btn) => btn.classList.toggle('on', btn.dataset.go === state.view));
    $('#today-label').textContent = fmtLong(new Date());
    const n = notifications().length;
    const badge = $('#note-badge');
    badge.hidden = !n;
    badge.textContent = n > 9 ? '9+' : String(n);
  }
  function animateNumbers() {
    document.querySelectorAll('[data-count]').forEach((el) => {
      const target = Number(el.dataset.count);
      if (!Number.isFinite(target)) return;
      const t0 = performance.now();
      const step = (now) => {
        const p = Math.min(1, (now - t0) / 480);
        el.textContent = String(Math.round(target * (1 - (1 - p) ** 3)));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }
  function render() {
    const main = $('#main');
    renderChrome();
    if (state.soft && state.view === 'employees' && main.dataset.view === 'employees' && $('#emp-grid')) {
      $('#emp-grid').innerHTML = employeeCards();
      const shown = state.employees.filter(matchesFilters).length;
      const meta = $('#page-sub');
      if (meta) meta.textContent = `${shown} of ${state.employees.length} people`;
      state.soft = false;
      return;
    }
    state.soft = false;
    main.dataset.view = state.view;
    main.innerHTML = views[state.view]();
    if (state.view === 'dashboard') requestAnimationFrame(drawChart);
    requestAnimationFrame(animateNumbers);
  }
  function go(view) {
    if (!VIEWS.includes(view)) return;
    state.view = view;
    history.replaceState(null, '', `#${view}`);
    window.scrollTo(0, 0);
    render();
  }
  function toast(text) {
    const el = $('#toast');
    el.hidden = false;
    el.textContent = text;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.hidden = true; }, 2400);
  }

  function drawChart() {
    const canvas = $('#man-chart');
    if (!canvas || !state.schedule) return;
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 640;
    const h = canvas.clientHeight || 280;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const series = chartSeries();
    const max = Math.max(1, ...series.flatMap((s) => s.values));
    const pad = { l: 32, r: 8, t: 12, b: 28 };
    ctx.clearRect(0, 0, w, h);
    ctx.font = '12px Segoe UI, sans-serif';
    ctx.textAlign = 'left';
    ctx.strokeStyle = '#e7ebf0';
    ctx.fillStyle = '#98a2b3';
    for (let i = 0; i <= 4; i += 1) {
      const y = pad.t + (h - pad.t - pad.b) * (1 - i / 4);
      ctx.beginPath();
      ctx.moveTo(pad.l, y);
      ctx.lineTo(w - pad.r, y);
      ctx.stroke();
      ctx.fillText(String(Math.round(max * i / 4)), 0, y + 4);
    }
    const group = (w - pad.l - pad.r) / 7;
    const barW = Math.min(16, (group - 20) / 3);
      DAYS.forEach((label, i) => {
      series.forEach((item, s) => {
        const bh = Math.max(0, (item.values[i] / max) * (h - pad.t - pad.b));
        const x = pad.l + i * group + (group - (barW * 3 + 8)) / 2 + s * (barW + 4);
        const y = pad.t + (h - pad.t - pad.b) - bh;
        ctx.fillStyle = item.color;
        ctx.beginPath();
        const radius = Math.min(4, bh / 2, barW / 2);
        if (bh > 0 && ctx.roundRect) ctx.roundRect(x, y, barW, bh, radius);
        else ctx.rect(x, y, barW, bh);
        ctx.fill();
      });
      ctx.fillStyle = '#667085';
      ctx.textAlign = 'center';
      ctx.fillText(label.slice(0, 3), pad.l + i * group + group / 2, h - 8);
    });
    canvas._layout = { pad, group, series, w, h };
  }

    const week = state.schedule ? state.schedule.week : currentWeek();
    const strategy = state.settings.strategy || 'balanced';
    openOverlay(`<h2 style="margin-top:0">Generate schedule</h2><p class="muted">One Saturday–Friday week. Vacations, fixed offs, and Friday closure are applied before balancing.</p>
      <div class="field row"><div class="field"><label>Start date</label><input id="g-start" type="date" value="${week[0].key}" /></div><div class="field"><label>End date</label><input id="g-end" type="date" value="${week[6].key}" /></div></div>

  function playGenerate(week, strategy) {
    if (state.busy) return;
    state.busy = true;
    const steps = ['ANALYZING EMPLOYEES...', 'CHECKING VACATIONS...', 'APPLYING SHIFT RULES...', 'BALANCING MANPOWER...', 'VALIDATING SCHEDULE...'];
    let index = 0;
    const paint = (done) => {
      openOverlay(`<h2 style="margin-top:0">${done ? 'SCHEDULE GENERATED' : 'Generating'}</h2>${steps.map((text, i) => `<div class="step ${done || i < index ? 'done' : ''} ${!done && i === index ? 'on' : ''}">${done || i < index ? '✓' : '○'} ${text}</div>`).join('')}${done ? '<p>✓ The week is ready.</p>' : ''}`);
    };
    const finish = (ok) => {
      state.busy = false;
      if (!ok) {
        closeOverlay();
        toast('The schedule could not be generated.');
        return;
      }
      paint(true);
      setTimeout(() => { closeOverlay(); state.view = 'schedule'; render(); toast('Schedule generated'); }, 700);
    };
    paint(false);
    const tick = () => {
      index += 1;
      if (index < steps.length) {
        paint(false);
        setTimeout(tick, 420);
        return;
      }
      try {
        runGenerate(week, strategy);
        finish(true);
      } catch (err) {
        finish(false);
      }
    };
    setTimeout(tick, 420);
  }
  function runGenerate(week, strategy) {
    const had = state.generation > 0 && !!state.lastSig;
    const base = (Date.now() ^ (state.generation * 10007)) >>> 0;
    let best = null;
    for (let i = 0; i < 12; i += 1) {
      const result = generateSchedule(state.employees, (base + i * 9973) >>> 0, week, state.vacations, strategy, Number(state.settings.minManpower) || 8);
      result.sig = signature(result.rows);
      best = result;
      if (result.sig !== state.lastSig) break;
    }
    state.sameArrangement = had && best.sig === state.lastSig;
    state.lastSig = best.sig;
    state.schedule = best;
    state.generation += 1;
    state.stale = false;
    state.settings.strategy = strategy;
    applyVacations();
    save();
  }

  function readEmployee() {
    const name = $('#e-name').value.trim();
    const id = $('#e-id').value.trim();
    const department = $('#e-dept').value.trim();
    const position = $('#e-pos').value.trim();
    const offMode = $('#e-mode').value;
    const shifts = [{ start: $('#e-s1').value, end: $('#e-e1').value }];
    if ($('#e-split').checked) shifts.push({ start: $('#e-s2').value, end: $('#e-e2').value });
    const fixedOffDays = ['Friday'];
    if (offMode === 'fixed') {
      $('#e-days').querySelectorAll('input').forEach((box) => { if (box.checked && box.value !== 'Friday') fixedOffDays.push(box.value); });
    }
    if (!name || !id || !department || !position) return { error: 'Name, ID, department, and position are required.' };
    if (state.employees.some((e) => e.id === id && e.id !== state.editingId)) return { error: 'That employee ID is already used.' };
    const emp = { id, name, department, position, offMode, shifts, fixedOffDays, notes: $('#e-notes').value.trim() };
    const parsed = normalizeShifts(emp);
    if (parsed.some((s) => s.end <= s.start)) return { error: 'Each shift needs an end time after the start.' };
    if (shiftsOverlap(parsed)) return { error: 'The two shifts overlap.' };
    return emp;
  }

  function exportExcel() {
    if (!state.schedule) { toast('Generate a schedule before exporting.'); return; }
    const head = ['Employee', 'ID', 'Department', 'Position', ...DAYS];
    const rows = state.employees.map((emp) => {
      const cells = DAYS.map((day) => {
        const row = rowFor(emp.id, day);
        if (!row) return '';
        if (row.status === 'vacation') return `VACATION - ${row.vacation ? row.vacation.type : ''}`.trim();
        if (row.status === 'off') return 'OFF';
        return row.shifts.map((s) => s.label).join(' | ');
      });
      return [emp.name, emp.id, emp.department, emp.position, ...cells];
    });
    const man = [['Day', 'Block', 'Sales Advisors', 'Promoters', 'Test Drive', 'Coordinator', 'Other', 'Total']];
    buildCoverage().forEach((day) => {
      day.blocks.forEach((block) => {
        man.push([day.day, day.closed ? 'OFF / CLOSED' : block.label, block.counts.advisor, block.counts.promoter, block.counts.testdrive, block.counts.coordinator, block.counts.other, block.total]);

  function onClick(event) {
    if (event.target.classList && event.target.classList.contains('scrim')) { closeOverlay(); return; }
    const btn = event.target.closest('[data-go], [data-act]');
    if (!btn) return;
    if (btn.dataset.go) { go(btn.dataset.go); return; }
    const act = btn.dataset.act;
    if (act === 'close') closeOverlay();
    if (act === 'open-generate') openGenerate();
    if (act === 'do-generate') {
      if (!state.employees.length) { toast('Add an employee first.'); return; }
      const week = weekFrom($('#g-start').value);
      const strategy = ($('#overlay input[name=strategy]:checked') || {}).value || 'balanced';
      playGenerate(week, strategy);
    }
    if (act === 'regen') {
      if (!state.employees.length) return;
      const week = state.schedule ? state.schedule.week : currentWeek();
      playGenerate(week, state.settings.strategy || 'balanced');
    }
    if (act === 'validate') {
      if (!state.schedule) { toast('Generate a schedule first.'); return; }
      applyVacations();
      save();
      render();
      if (state.validation.issues.length) issuesModal();
      else toast('100% valid');
    }
    if (act === 'issues') issuesModal();
    if (act === 'chart') { state.chartRole = btn.dataset.role; render(); }
    if (act === 'heat') { state.heatRole = btn.dataset.role; render(); }
    if (act === 'profile') profileModal(btn.dataset.id);
    if (act === 'edit') employeeForm(empById(btn.dataset.id));
    if (act === 'add-employee') employeeForm(null);
    if (act === 'save-employee') {
      const emp = readEmployee();
      if (emp.error) { $('#e-msg').textContent = emp.error; return; }
      if (state.editingId) {
        const index = state.employees.findIndex((e) => e.id === state.editingId);
        if (state.editingId !== emp.id) state.vacations.forEach((v) => { if (v.employeeId === state.editingId) v.employeeId = emp.id; });
        if (index >= 0) state.employees[index] = emp;
      } else state.employees.push(emp);
      clearSchedule();
      save();
      closeOverlay();
      render();
      toast('Employee saved. Generate the schedule again.');
    }
    if (act === 'delete-employee') {
      const emp = empById(btn.dataset.id);
      if (!emp || !confirm(`Delete ${emp.name}?`)) return;
      state.employees = state.employees.filter((e) => e.id !== emp.id);
      state.vacations = state.vacations.filter((v) => v.employeeId !== emp.id);
      clearSchedule();
      save();
      closeOverlay();
      render();
    }
    if (act === 'vac-add') vacationForm(btn.dataset.id || '', null);
    if (act === 'vac-edit') {
      const vac = state.vacations.find((v) => v.id === btn.dataset.id);
      if (vac) vacationForm(vac.employeeId, vac);
    }
    if (act === 'vac-open') { event.stopPropagation(); vacationDetail(btn.dataset.id); }
    if (act === 'vac-delete') {
      const vac = state.vacations.find((v) => v.id === btn.dataset.id);
      if (!vac || !confirm('Delete this vacation?')) return;
      state.vacations = state.vacations.filter((v) => v.id !== vac.id);
      applyVacations();
      save();
      closeOverlay();
      render();
      toast('Vacation deleted');
    }
    if (act === 'save-vac') saveVacationFromForm();
    if (act === 'cal-prev') {
      state.cal.m -= 1;
      if (state.cal.m < 0) { state.cal.m = 11; state.cal.y -= 1; }
      render();
    }
    if (act === 'cal-next') {
      state.cal.m += 1;
      if (state.cal.m > 11) { state.cal.m = 0; state.cal.y += 1; }
      render();
    }
    if (act === 'cal-day' && !event.target.closest('[data-act="vac-open"]')) vacationForm('', { employeeId: state.employees[0] ? state.employees[0].id : '', startDate: btn.dataset.date, endDate: btn.dataset.date, type: VACATION_TYPES[0], notes: '', id: '' });
    if (act === 'who') whoModal(btn.dataset.day, btn.dataset.block);
    if (act === 'affected') affectedModal(btn.dataset.day, btn.dataset.block);
    if (act === 'scroll-history') { const node = $('#vac-history'); if (node) node.scrollIntoView({ behavior: 'smooth' }); }
    if (act === 'notes') {
      const items = notifications();
      openOverlay(`<h2 style="margin-top:0">Notifications</h2>${items.length ? items.map((item) => `<div class="check"><span>${esc(item.text)}</span></div>`).join('') : '<p class="muted">You are caught up.</p>'}<button class="btn" type="button" data-act="close">Close</button>`, true);
    }
    if (act === 'settings') {
      openOverlay(`<h2 style="margin-top:0">Settings</h2>
        <div class="field"><label>Minimum manpower before a vacation warning</label><input id="set-min" type="number" min="1" max="40" value="${esc(state.settings.minManpower)}" /></div>
        <p class="muted">A warning appears when vacation pushes a block under this number.</p>
        <div class="actions"><button class="btn" type="button" data-act="json">Export data</button><button class="btn" type="button" data-act="import">Import data</button></div>
        <div class="actions" style="margin-top:10px"><button class="btn-ghost" type="button" data-act="reset">Reset master data</button><button class="btn-primary" type="button" data-act="save-settings">Save</button></div>`, true);
    }
    if (act === 'save-settings') {
      state.settings.minManpower = Math.max(1, Number($('#set-min').value) || 8);
      applyVacations();
      save();
      closeOverlay();
      render();
      toast('Settings saved');
    }
    if (act === 'excel') exportExcel();
    if (act === 'print') window.print();
    if (act === 'json') exportJson();
    if (act === 'import') $('#import-file').click();
    if (act === 'reset') {
      if (!confirm('Reset employees to the original roster? Vacations and the generated week on this browser will be cleared.')) return;
      state.employees = defaultEmployees();
      state.vacations = [];
      state.schedule = null;
      state.validation = null;
      state.warnings = [];
      state.generation = 0;
      state.lastSig = '';
      state.stale = false;
      save();
      closeOverlay();
      render();
    }
  }

  document.body.addEventListener('click', onClick);
  document.body.addEventListener('input', (event) => {
    if (event.target.id === 'v-start' || event.target.id === 'v-end') {
      const start = $('#v-start').value;
      const end = $('#v-end').value;
      $('#v-days').textContent = start && end && end >= start ? String(inclusiveDays(start, end)) : '—';
    }
    if (event.target.id === 'g-start' || event.target.id === 'g-end') {
      const source = event.target.id === 'g-end' ? event.target.value : $('#g-start').value;
      const week = weekFrom(source);
      if ($('#g-start')) $('#g-start').value = week[0].key;
      if ($('#g-end')) $('#g-end').value = week[6].key;
      if ($('#g-week')) $('#g-week').textContent = `Week: ${fmtShort(week[0].key)} – ${fmtLong(week[6].key)}`;
    }
    if (event.target.id === 'emp-search') {
      state.filters.q = event.target.value;
      state.soft = true;
      render();
    }
  });
  document.body.addEventListener('change', (event) => {
    const map = { 'f-dept': 'dept', 'f-pos': 'pos', 'f-status': 'status', 'f-vac': 'vacation', 'f-off': 'offday' };
    if (map[event.target.id]) {
      state.filters[map[event.target.id]] = event.target.value;
      state.soft = true;
      render();
    }
    if (event.target.id === 'e-mode') $('#fixed-wrap').hidden = event.target.value !== 'fixed';
    if (event.target.id === 'e-split') $('#split-times').hidden = !event.target.checked;
    if (event.target.id === 'e-pos' && !state.editingId) {
      const pos = event.target.value.toLowerCase();
      if (pos.includes('coordinator')) { $('#e-mode').value = 'friday-only'; $('#e-s1').value = '12:00'; $('#e-e1').value = '21:00'; $('#e-split').checked = false; }
      else if (pos.includes('test')) { $('#e-mode').value = 'fixed'; $('#e-s1').value = '09:00'; $('#e-e1').value = '18:00'; $('#e-split').checked = false; }
      else if (pos.includes('promot')) { $('#e-mode').value = 'flexible'; $('#e-s1').value = '12:00'; $('#e-e1').value = '21:00'; $('#e-split').checked = false; }
      else if (pos.includes('advisor')) { $('#e-mode').value = 'advisor-pool'; $('#e-s1').value = '12:00'; $('#e-e1').value = '21:00'; $('#e-split').checked = false; }
      $('#fixed-wrap').hidden = $('#e-mode').value !== 'fixed';
      $('#split-times').hidden = !$('#e-split').checked;
    }
    if (event.target.id === 'import-file' && event.target.files[0]) {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result || ''));
          if (!data || !Array.isArray(data.employees) || !data.employees.length) throw new Error('missing employees');
          state.employees = data.employees;
          state.vacations = Array.isArray(data.vacations) ? data.vacations : [];
          state.settings = { minManpower: 8, strategy: 'balanced', ...(data.settings || {}) };
          state.schedule = data.schedule || null;
          state.generation = data.generation || 0;
          state.lastSig = data.lastSig || '';
          applyVacations();
          save();
          closeOverlay();
          render();
          toast('Backup restored');
        } catch (err) {
          toast('That file is not a workforce backup.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }
  });
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeOverlay(); });
  window.addEventListener('resize', () => { if (state.view === 'dashboard') drawChart(); });
  window.addEventListener('hashchange', () => {
    const next = location.hash.replace('#', '');
    if (VIEWS.includes(next) && next !== state.view) go(next);
  });
  const chartMove = (event) => {
    const canvas = $('#man-chart');
    const tip = $('#chart-tip');
    if (!canvas || !tip || !canvas._layout) return;
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const { pad, group, series } = canvas._layout;
    const i = Math.floor((x - pad.l) / group);
    if (i < 0 || i > 6) { tip.style.opacity = 0; return; }
    tip.style.opacity = 1;
    tip.style.left = `${Math.min(rect.width - 140, Math.max(8, x + 12))}px`;
    tip.style.top = '12px';
    tip.innerHTML = `<b>${DAYS[i]}</b><br>${series.map((s) => `${esc(s.name)}: ${s.values[i]}`).join('<br>')}`;
  };
  document.body.addEventListener('mousemove', (event) => { if (event.target.id === 'man-chart') chartMove(event); });
  document.body.addEventListener('mouseleave', (event) => { if (event.target.id === 'man-chart') { const tip = $('#chart-tip'); if (tip) tip.style.opacity = 0; } }, true);

  load();
  applyVacations();
  const hash = location.hash.replace('#', '');
  state.view = VIEWS.includes(hash) ? hash : 'dashboard';
  render();
})();
</script>
</body>
</html>
