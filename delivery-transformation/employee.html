<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery Transformation — Delivery Employee</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topnav">
    <div class="brand">
      <div class="brand-mark">T</div>
      <div><strong>TOYOTA</strong><span>Delivery Transformation · Delivery Employee</span></div>
    </div>
    <nav class="nav-links" id="admin-links" hidden>
      <a href="admin.html">Admin</a>
      <a href="coordinator.html">Coordinator view</a>
      <a href="employee.html" class="active">Employee view</a>
    </nav>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="who" class="badge">—</span>
      <button type="button" class="btn-ghost" id="logout-btn">Logout</button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Live Sheet — delivery entry</h1>
      <p>Fill in status, dates, الناقل, city, and notes for your VINs. Changes save as soon as you pick a value.</p>
    </section>

    <div class="kpi-row" id="kpis"></div>

    <div class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search VIN / order / product…" />
        <label style="display:flex;gap:6px;align-items:center;font-size:.84rem">
          <input type="checkbox" id="mine-only" checked style="width:auto" /> My VINs only
        </label>
        <button type="button" class="btn" id="refresh-btn">Refresh</button>
        <span class="hint" id="live-meta"></span>
      </div>
      <div class="table-wrap"><table class="data" id="live-table"></table></div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script src="live.js"></script>
  <script>
    (async function () {
      const { api, esc, requireRole } = DTX;
      const user = requireRole(['employee', 'admin']);
      if (!user) return;
      if (user.role === 'admin') {
        document.getElementById('admin-links').hidden = false;
        document.getElementById('mine-only').checked = false;
      }
      DTXLive.wireHeader(user);
      await DTXLive.loadMeta();

      async function load() {
        const q = document.getElementById('search').value.trim();
        const live = await api(`/live-sheet${q ? `?q=${encodeURIComponent(q)}` : ''}`);
        const all = live.rows || [];
        const mine = all.filter((r) => r.ops.assignedEmployeeId === user.id);
        const rows = document.getElementById('mine-only').checked ? mine : all;
        const done = mine.filter((r) => r.ops.opsStatus === 'Claimed' || r.ops.opsStatus === 'تم التسليم').length;
        document.getElementById('kpis').innerHTML = [
          ['My VINs', mine.length],
          ['Delivered / Claimed', done],
          ['Open', mine.length - done],
          ['All on Live Sheet', live.total],
        ].map(([l, n]) => `<div class="kpi"><strong>${n}</strong><span>${esc(l)}</span></div>`).join('');
        document.getElementById('live-meta').textContent =
          `${rows.length} shown · synced ${new Date(live.at).toLocaleTimeString()}`;
        DTXLive.renderTable(document.getElementById('live-table'), rows, {
          mode: 'employee',
          onOpen: (vin) => DTXLive.openDrawer(vin, { mode: 'employee', onSaved: load }),
        });
      }

      let t;
      document.getElementById('search').addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(load, 250);
      });
      document.getElementById('mine-only').addEventListener('change', load);
      document.getElementById('refresh-btn').addEventListener('click', load);
      setInterval(() => {
        const a = document.activeElement;
        if (a && a.classList && a.classList.contains('cell-edit')) return;
        if (document.getElementById('vin-drawer-back')?.classList.contains('open')) return;
        load().catch(() => {});
      }, 15000);
      load().catch((e) => alert(e.message));
    })();
  </script>
</body>
</html>
