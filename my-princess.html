<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Princess</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#1a0c22; --bg2:#4a1a3a; --rose:#ff8fb1; --gold:#ffd98e; --cream:#fff7f0; --ink:#3a1830; --soft:#c9a0b4;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;}
body{
  color:var(--cream);
  font-family:'Nunito',system-ui,sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, #5a2048 0%, transparent 55%),
    radial-gradient(circle at 10% 90%, rgba(255,143,177,.18), transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(255,217,142,.12), transparent 35%),
    linear-gradient(160deg, var(--bg), var(--bg2));
  display:flex;align-items:center;justify-content:center;
  padding:28px 16px calc(28px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{position:absolute;top:-40px;color:var(--rose);opacity:.55;animation:fall linear forwards;font-size:18px}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
.wrap{position:relative;z-index:1;width:100%;max-width:420px}
.eyebrow{
  text-align:center;margin:0 0 14px;
  font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700;
}
.ticket{
  position:relative;
  background:linear-gradient(180deg,#fff9f4 0%,#ffe8ef 100%);
  color:var(--ink);
  border-radius:22px;
  box-shadow:
    0 0 0 1px rgba(255,217,142,.35),
    0 24px 60px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.8);
  overflow:hidden;
  animation:in .9s ease both;
}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.ticket::before,.ticket::after{
  content:"";position:absolute;left:50%;width:28px;height:28px;border-radius:50%;
  background:var(--bg);transform:translateX(-50%);z-index:2;
}
.ticket::before{top:-14px}
.ticket::after{bottom:-14px}
.perfs{
  position:absolute;left:18px;right:18px;top:48%;
  border-top:2px dashed rgba(58,24,48,.18);
}
.stamp{
  position:absolute;top:18px;right:18px;
  width:72px;height:72px;border:2px dashed rgba(235,10,80,.45);border-radius:50%;
  display:grid;place-items:center;transform:rotate(12deg);
  color:#c2185b;font-family:'Dancing Script',cursive;font-size:22px;font-weight:700;line-height:1.05;text-align:center;
  background:rgba(255,143,177,.12);
}
.head{padding:28px 24px 20px;text-align:center}
.seal{font-size:34px;margin-bottom:6px;filter:drop-shadow(0 4px 8px rgba(255,143,177,.4))}
.head h1{
  margin:0;font-family:'Dancing Script',cursive;font-size:clamp(34px,9vw,46px);
  color:#a01a4a;line-height:1.1;
}
.head .sub{margin:8px 0 0;color:#8a5a70;font-size:14px}
.body{padding:28px 24px 12px}
.row{
  display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
  padding:12px 0;border-bottom:1px solid rgba(58,24,48,.08);
}
.row:last-child{border-bottom:0}
.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9a6a80;font-weight:700;margin:0 0 4px}
.val{font-size:18px;font-weight:700;margin:0;color:var(--ink)}
.val.yes{color:#c2185b}
.val.no{color:#6b4a58}
.reason{
  margin-top:8px;padding:14px 16px;border-radius:14px;
  background:rgba(255,143,177,.14);border:1px solid rgba(192,24,91,.15);
  font-size:15px;line-height:1.55;color:#5a2a40;font-style:italic;
}
.foot{
  padding:8px 24px 26px;text-align:center;
  font-family:'Dancing Script',cursive;font-size:22px;color:#c2185b;
}
.empty{
  text-align:center;padding:48px 24px;color:var(--soft);
}
.empty h1{font-family:'Dancing Script',cursive;color:var(--gold);font-size:40px;margin:0 0 10px}
.empty p{margin:0 0 18px}
a.back{
  display:inline-block;margin-top:18px;color:var(--gold);text-decoration:none;
  font-weight:700;font-size:14px;letter-spacing:.04em;
}
a.back:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){.ticket{animation:none}.petal{display:none}}
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var raw = null;
  try { raw = localStorage.getItem('prettiest-answer'); } catch (e) {}
  var stored = null;
  try { stored = raw ? JSON.parse(raw) : null; } catch (e) {}
  var data = {
    name: q.get('n') || (stored && stored.name) || '',
    answer: q.get('a') || (stored && stored.answer) || '',
    call: q.get('c') || (stored && stored.call) || '',
    reason: q.get('r') || (stored && stored.reason) || '',
    at: Number(q.get('t') || (stored && (stored.updated || stored.at)) || 0) || Date.now()
  };

  for (var i = 0; i < 18; i++) {
    var p = document.createElement('div');
    p.className = 'petal';
    p.textContent = i % 3 === 0 ? '♥' : (i % 3 === 1 ? '❀' : '♡');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (14 + Math.random() * 18) + 'px';
    p.style.animationDuration = (6 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 5) + 's';
    document.getElementById('petals').appendChild(p);
  }

  var app = document.getElementById('app');
  if (!data.answer && !data.call && !data.reason) {
    app.innerHTML =
      '<div class="empty">' +
        '<h1>My Princess</h1>' +
        '<p>No answer yet. When she sends her answer, the love ticket will open here.</p>' +
        '<a class="back" href="I-See-U-The-Prettiest.html">← Back to her page</a>' +
      '</div>';
    return;
  }

  function label(v) {
    if (!v) return '—';
    var s = String(v).toLowerCase();
    if (s === 'yes') return 'Yes ♥';
    if (s === 'no') return 'No';
    return v;
  }
  function cls(v) {
    var s = String(v || '').toLowerCase();
    return s === 'yes' ? 'yes' : (s === 'no' ? 'no' : '');
  }
  function when(ts) {
    try {
      return new Date(ts).toLocaleString(undefined, {
        weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    } catch (e) { return '—'; }
  }
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var who = data.name ? ('For ' + escapeHtml(data.name)) : 'From her heart to yours';
  var stamp = String(data.answer || '').toLowerCase() === 'yes' ? 'Yes<br>♥' : (String(data.answer || '').toLowerCase() === 'no' ? 'No' : 'Love');

  app.innerHTML =
    '<p class="eyebrow">My Princess · Love Ticket</p>' +
    '<article class="ticket" aria-label="Love ticket with her answer">' +
      '<div class="stamp">' + stamp + '</div>' +
      '<div class="head">' +
        '<div class="seal">🌹</div>' +
        '<h1>My Princess</h1>' +
        '<p class="sub">' + who + '</p>' +
      '</div>' +
      '<div class="perfs" aria-hidden="true"></div>' +
      '<div class="body">' +
        '<div class="row"><div><p class="lab">Her answer</p><p class="val ' + cls(data.answer) + '">' + label(data.answer) + '</p></div></div>' +
        '<div class="row"><div><p class="lab">A call?</p><p class="val ' + cls(data.call) + '">' + label(data.call) + '</p></div></div>' +
        (data.reason
          ? '<div class="row" style="display:block"><p class="lab">What she wrote</p><div class="reason">“' + escapeHtml(data.reason) + '”</div></div>'
          : '') +
        '<div class="row"><div><p class="lab">Opened</p><p class="val" style="font-size:14px;font-weight:600">' + when(data.at) + '</p></div></div>' +
      '</div>' +
      '<div class="foot">I see you the prettiest ♥</div>' +
    '</article>' +
    '<div style="text-align:center"><a class="back" href="I-See-U-The-Prettiest.html">← Back to her page</a></div>';
})();
</script>
</body>
</html>
