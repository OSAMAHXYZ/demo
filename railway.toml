[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
restartPolicyType = "on_failure"

# Keep Excel files and entries after every code push:
# 1) Railway → this service → Volumes → New volume
# 2) Mount path: /data
# 3) Variables → PERSISTENT_DATA_DIR=/data
# Live data + keep copy then stay at /data. Code deploys do not replace them.
# Admin Push → Keep data shows whether the volume is on.
